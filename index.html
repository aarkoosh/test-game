<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { acceleratedRaycast, computeBoundsTree, disposeBoundsTree } from 'three-mesh-bvh';

const EXCLUDED_CLIP = 'T-Pose (No Animation)';
const CROSSFADE = 0.25;
const WALK_SPEED = 120;
const ROLL_SPEED = 260;
const ROTATION_LERP = 10;
const TERRAIN_SIZE = 950000;
const HEIGHT_SCALE = 25000;
const FLOOR_BOUND = TERRAIN_SIZE * 0.48 - 20;
const SKY_SCALE = 10000;
const SKY_ANIM_SPEED = 3;
const JUMP_VELOCITY = 42;
const JUMP_GRAVITY = 78;

const FOREST_REF_SIZE = 8000;
const FOREST_SIZE_SCALE = TERRAIN_SIZE / FOREST_REF_SIZE;
const FOREST_TREE_COUNT = 350000;
const FOREST_SEED = 42;
const TERRAIN_HEIGHTMAP_URL = './heightmapdefault.png';
const FOREST_SPAWN_GUIDE_URL = './heightmap6step.png';
const FOREST_SPAWN_GUIDE_STEP = 4;

  grass: FOLIAGE_SCALE.grass.min * 1.1,

const loadingEl = document.getElementById('loading');
const loadingTitleEl = document.getElementById('loading-title');
const loadingItemsEl = document.getElementById('loading-items');

const LOAD_STEPS = [
  'Heightmap',
  'Forest guide',
  'Terrain textures',
  'Terrain',
  'Forest models',
  'Forest placement',
  'Forest build',
  'Character',
];

const loadingMgr = {
  _items: new Map(),
  init(names) {
    this._items.clear();
    loadingItemsEl.innerHTML = '';
    loadingTitleEl.textContent = 'Loading…';
    loadingEl.classList.remove('error', 'hidden');
    for (const name of names) {
      const row = document.createElement('div');
      row.className = 'loading-row';
      const label = document.createElement('span');
      label.className = 'loading-name';
      label.textContent = name;
      const status = document.createElement('span');
      status.className = 'loading-status pending';
      status.textContent = 'Pending';
      row.append(label, status);
      loadingItemsEl.appendChild(row);
      this._items.set(name, { el: status, state: 'pending' });
    }
  },
  set(name, state, detail) {
    const item = this._items.get(name);
    if (!item) return;
    item.state = state;
    const key = state.toLowerCase();
    item.el.className = `loading-status ${key}`;
    item.el.textContent = detail || state;
  },
  fail(err) {
    loadingEl.classList.add('error');
    loadingTitleEl.textContent = 'Failed: ' + (err?.message || err);
    for (const [name, item] of this._items) {
      if (item.state === 'loading') this.set(name, 'Error');
    }
  },
  hide() {
    loadingTitleEl.textContent = 'Ready';
    setTimeout(() => loadingEl.classList.add('hidden'), 350);
  },
};

// ---------- Scene setup ----------

const sunParams = {
  elevation: 32, azimuth: 180, exposure: 0.25, turbidity: 10, rayleigh: 1,
  cloudCoverage: 0.55, cloudDensity: 0.85, cloudElevation: 0.5,
  cloudScale: 0.0002, cloudSpeed: 0.00045,
};
const skySunDir = new THREE.Vector3();

const scene = new THREE.Scene();
scene.background = null;
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, TERRAIN_SIZE * 4);
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = sunParams.exposure;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const sceneEnv = new THREE.Scene();
const sky = new Sky();
sky.scale.setScalar(SKY_SCALE);
sceneEnv.add(sky);
const skyVisual = new Sky();
skyVisual.scale.setScalar(SKY_SCALE);
skyVisual.frustumCulled = false;
skyVisual.renderOrder = -1000;
skyVisual.material.depthTest = false;
skyVisual.material.depthWrite = false;
skyVisual.material.toneMapped = false;
scene.add(skyVisual);
const skyUniforms = sky.material.uniforms;
const skyVisUniforms = skyVisual.material.uniforms;
let skyRenderTarget;
const pmremGenerator = new THREE.PMREMGenerator(renderer);

function applySkyUniforms() {
  skyUniforms.turbidity.value = sunParams.turbidity;
  skyUniforms.rayleigh.value = sunParams.rayleigh;
  skyVisUniforms.turbidity.value = sunParams.turbidity;
  skyVisUniforms.rayleigh.value = sunParams.rayleigh;
  for (const u of [skyUniforms, skyVisUniforms]) {
    u.cloudCoverage.value = sunParams.cloudCoverage;
    u.cloudDensity.value = sunParams.cloudDensity;
    u.cloudElevation.value = sunParams.cloudElevation;
    u.cloudScale.value = sunParams.cloudScale;
    u.cloudSpeed.value = sunParams.cloudSpeed;
  }
  renderer.toneMappingExposure = sunParams.exposure;
}

function syncSkyToCamera() {
  // Keep the dome centered on the camera and sized to the far plane so
  // extreme orbit zoom doesn't clip or shimmer the skydome.
  const dist = camera.position.distanceTo(controls.target);
  const far = Math.max(HEIGHT_SCALE * 4, dist * 2 + TERRAIN_SIZE);
  if (Math.abs(camera.far - far) > far * 0.05) {
    camera.far = far;
    camera.updateProjectionMatrix();
  }
  const scale = Math.max(SKY_SCALE, camera.far * 0.45);
  skyVisual.scale.setScalar(scale);
  skyVisual.position.copy(camera.position);
}

function updateSun() {
  const phi = THREE.MathUtils.degToRad(90 - sunParams.elevation);
  const theta = THREE.MathUtils.degToRad(sunParams.azimuth);
  skySunDir.setFromSphericalCoords(1, phi, theta);
  skyUniforms.sunPosition.value.copy(skySunDir);
  skyVisUniforms.sunPosition.value.copy(skySunDir);
  sun.position.copy(skySunDir).multiplyScalar(4000);
  if (skyRenderTarget !== undefined) skyRenderTarget.dispose();
  skyUniforms.mieCoefficient.value = 0.005;
  skyUniforms.mieDirectionalG.value = 0.8;
  skyVisUniforms.mieCoefficient.value = 0.005;
  skyVisUniforms.mieDirectionalG.value = 0.8;
  skyUniforms.showSunDisc.value = false;
  skyRenderTarget = pmremGenerator.fromScene(sceneEnv);
  scene.environment = skyRenderTarget.texture;
  skyVisUniforms.showSunDisc.value = true;
  applySkyUniforms();
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 1;
controls.maxDistance = 500;
controls.enablePan = false;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: null };
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xfff4e6, 1.8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 1.0;
scene.add(sun);
scene.add(sun.target);
const fill = new THREE.DirectionalLight(0x8899cc, 0.35);
fill.position.set(-100, 80, -60);
scene.add(fill);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

updateSun();

const clock = new THREE.Clock();
let skyAnimTime = 0;
const keys = { KeyW: false, KeyA: false, KeyS: false, KeyD: false };
let character = null;
let terrainGroup = null;
let terrainMesh = null;
let terrainEntry = null;
let terrainForestSystem = null;
let forestTemplatesPromise = null;
let forestDensityNoise = null;
let terrainForestBuildGeneration = 0;

const _dummy = new THREE.Object3D();
const _v = new THREE.Vector3();
const _box = new THREE.Box3();

// ---------- Terrain collision ----------

const _ray = new THREE.Raycaster();
const _rayOrigin = new THREE.Vector3();
const _rayDir = new THREE.Vector3(0, -1, 0);

function sampleTerrainHeight(x, z) {
  // Prefer BVH raycast so feet match the rendered triangles (critical on inclines).
  if (terrainMesh) {
    _rayOrigin.set(x, HEIGHT_SCALE * 3, z);
    _ray.set(_rayOrigin, _rayDir);
    _ray.far = HEIGHT_SCALE * 5;
    const hits = _ray.intersectObject(terrainMesh, false);
    if (hits.length > 0) return hits[0].point.y;
  }
  if (terrainEntry) {
    const sample = sampleTerrainSurface(terrainEntry, x, z);
    if (sample) return sample.y;
  }
  return null;
}

function groundOffsetY() {
  return character ? Math.max(0.05, character.height * 0.02) : 0.05;
}

// ---------- Forest ----------

class PerlinNoise {
  constructor(seed = 0) { this.perm = new Array(512); this.setSeed(seed); }
  setSeed(seed) {
    const p = [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
    let s = seed >>> 0;
    for (let i = 255; i > 0; i--) { s = (s * 1103515245 + 12345) & 0x7fffffff; const j = s % (i + 1); [p[i], p[j]] = [p[j], p[i]]; }
    for (let i = 0; i < 256; i++) this.perm[i] = this.perm[i + 256] = p[i];
  }
  fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  lerp(t, a, b) { return a + t * (b - a); }
  grad(hash, x, y) { const h = hash & 7; if (h < 4) return ((h & 1) === 0 ? x : -x) + ((h & 2) === 0 ? y : -y); return h === 4 ? x : h === 5 ? -x : h === 6 ? y : -y; }
  noise(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = this.fade(xf), v = this.fade(yf);
    const aa = this.perm[this.perm[X] + Y], ab = this.perm[this.perm[X] + Y + 1];
    const ba = this.perm[this.perm[X + 1] + Y], bb = this.perm[this.perm[X + 1] + Y + 1];
    return this.lerp(v, this.lerp(u, this.grad(aa, xf, yf), this.grad(ba, xf - 1, yf)), this.lerp(u, this.grad(ab, xf, yf - 1), this.grad(bb, xf - 1, yf - 1)));
  }
  fbm(x, y, octaves = 4, lacunarity = 2, gain = 0.5) {
    let value = 0, amplitude = 1, frequency = 1, maxValue = 0;
    for (let i = 0; i < octaves; i++) { value += amplitude * this.noise(x * frequency, y * frequency); maxValue += amplitude; amplitude *= gain; frequency *= lacunarity; }
    return value / maxValue;
  }
}

function mulberry32(seed) {
  return () => {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function computeMeshBox(root, target = _box) {
  target.makeEmpty();
  root.updateWorldMatrix(true, true);
  root.traverse((child) => {
    if (!child.isMesh || !child.geometry?.attributes?.position) return;
    const pos = child.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      _v.fromBufferAttribute(pos, i);
      _v.applyMatrix4(child.matrixWorld);
      target.expandByPoint(_v);
    }
  });
  if (target.isEmpty()) target.setFromObject(root);
  return target;
}

function isAlphaBlendMaterial(mat) {
  if (mat.alphaMode === 'BLEND') return true;
  if (mat.transparent && mat.opacity < 0.999 && mat.alphaTest < 0.01) return true;
  const name = (mat.name || '').toLowerCase();
  return /leaf|leaves|branch|foliage|projection/.test(name);
}

function configureForestMaterial(mat) {
  if (!mat) return;
  mat.side = THREE.DoubleSide;
  if (mat.map) {
    mat.map.colorSpace = THREE.SRGBColorSpace;
    mat.map.needsUpdate = true;
  }
  if (mat.emissiveMap) mat.emissiveMap.colorSpace = THREE.SRGBColorSpace;
  // MASK cutout must stay opaque + alphaTest. transparent:true often makes
  // instanced foliage vanish with logarithmic depth buffers.
  if (mat.alphaMode === 'MASK' || (mat.map && (mat.alphaTest > 0 || /tree|leaf|foliage/i.test(mat.name || '')))) {
    mat.transparent = false;
    mat.opacity = 1;
    mat.alphaTest = Math.max(mat.alphaCutoff ?? 0, 0.4);
    mat.depthWrite = true;
    mat.alphaToCoverage = true;
  } else if (isAlphaBlendMaterial(mat)) {
    mat.transparent = true;
    mat.depthWrite = false;
    mat.alphaTest = 0;
  } else {
    mat.transparent = false;
    mat.opacity = 1;
    mat.alphaTest = 0;
    mat.depthWrite = true;
  }
  mat.needsUpdate = true;
}

function cloneForestMaterial(source) {
  if (Array.isArray(source)) {
    return source.map((m) => {
      const c = m.clone();
      c.morphTargets = false;
      c.morphNormals = false;
      configureForestMaterial(c);
      return c;
    });
  }
  const c = source.clone();
  c.morphTargets = false;
  c.morphNormals = false;
  configureForestMaterial(c);
  return c;
}

function prepareMeshes(root) {
  root.traverse((child) => {
    if (!child.isMesh) return;
    const mats = Array.isArray(child.material) ? child.material : [child.material];
    for (const mat of mats) configureForestMaterial(mat);
  });
}

function consolidateTemplateParts(parts) {
  if (parts.length <= 1) return parts;
  const merged = mergeGeometries(parts.map((p) => p.geometry), true);
  if (!merged) return parts;
  const materials = parts.map((p) => (Array.isArray(p.material) ? p.material : [p.material])).flat();
  return [{ geometry: merged, material: materials.length === 1 ? materials[0] : materials }];
}

function foliageCategory(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('tree')) return 'tree';
  if (n.includes('grass')) return 'grass';
  if (n.includes('flower') || n.includes('daisy') || n.includes('daffodil')) return 'flower';
  if (n.includes('plant')) return 'plant';
  return 'plant';
}

function bakeTreeTemplate(template, category) {
  template.updateWorldMatrix(true, true);
  const meshes = [];
  template.traverse((child) => { if (child.isMesh) meshes.push(child); });
  if (!meshes.length) throw new Error(`No mesh on template ${template.name}`);

  // Keep full matrixWorld so Sketchfab/FBX axis conversion stays (Y-up).
  const parts = meshes.map((mesh) => {
    const geometry = mesh.geometry.clone();
    geometry.applyMatrix4(mesh.matrixWorld);
    return { geometry, material: cloneForestMaterial(mesh.material) };
  });

  const worldBox = new THREE.Box3();
  for (const part of parts) {
    part.geometry.computeBoundingBox();
    worldBox.union(part.geometry.boundingBox);
  }
  const minY = Number.isFinite(worldBox.min.y) ? worldBox.min.y : 0;
  const midX = (worldBox.min.x + worldBox.max.x) * 0.5;
  const midZ = (worldBox.min.z + worldBox.max.z) * 0.5;
  const height = Math.max(worldBox.max.y - worldBox.min.y, 1e-6);
  const norm = 1 / height;
  // Slight sink so MASK cutout / pivot slack doesn't leave plants hovering.
  const sink = height * 0.02;

  // Center XZ + ground Y first, THEN normalize. Scaling around the world
  // origin while plants are still at pack layout positions was the old float bug.
  for (const part of parts) {
    part.geometry.translate(-midX, -minY - sink, -midZ);
    part.geometry.scale(norm, norm, norm);
    part.geometry.computeVertexNormals();
    part.geometry.computeBoundingBox();
    part.geometry.computeBoundingSphere();
  }

  const kind = category || foliageCategory(template.name);
  return {
    name: template.name,
    category: kind,
    parts: consolidateTemplateParts(parts),
    sourceHeight: height,
    scaleMin: FOLIAGE_SCALE[kind].min,
    scaleMax: FOLIAGE_SCALE[kind].max,
  };
}

function findFoliageLayoutRoot(root) {
  let node = root;
  while (node.children.length === 1 && !node.children[0].isMesh) {
    node = node.children[0];
  }
  return node;
}

function extractFoliageTemplates(gltf) {
  gltf.scene.updateWorldMatrix(true, true);
  const layout = findFoliageLayoutRoot(gltf.scene);
  const templates = [];
  for (const child of layout.children) {
    let hasMesh = false;
    child.traverse((n) => { if (n.isMesh) hasMesh = true; });
    if (!hasMesh) continue;
    // Neutralize pack layout translation so each plant is authored at its own origin.
    child.updateWorldMatrix(true, true);
    templates.push(bakeTreeTemplate(child));
  }
  if (!templates.length) throw new Error('No foliage templates found in pack');
  return templates;
}

function isForestZone4TreeTemplate(template) {
  return FOREST_ZONE4_TREE_NAME_RE.test(template?.name || '');
}

function buildFoliageTypeWeights(templates) {
  const byCat = { tree: [], grass: [], flower: [], plant: [] };
  templates.forEach((t, i) => {
    if (t.category === 'tree' && !isForestZone4TreeTemplate(t)) return;
    byCat[t.category]?.push(i);
  });
  const entries = [];
  let total = 0;
  for (const [cat, idxs] of Object.entries(byCat)) {
    if (!idxs.length) continue;
    const share = FOLIAGE_SPAWN_WEIGHT[cat] ?? 0;
    if (share <= 0) continue;
    const each = share / idxs.length;
    for (const i of idxs) {
      entries.push({ index: i, weight: each });
      total += each;
    }
  }
  if (!total) throw new Error('No foliage types available for forest spawn pool');
  let acc = 0;
  return entries.map((e) => {
    acc += e.weight / total;
    return { index: e.index, cdf: acc };
  });
}

function pickFoliageType(weights, rng) {
  const r = rng();
  for (const entry of weights) {
    if (r <= entry.cdf) return entry.index;
  }
  return weights[weights.length - 1].index;
}

async function loadForestTreeTemplates() {
  if (!forestTemplatesPromise) {
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    const loader = new GLTFLoader();
    forestTemplatesPromise = new Promise((resolve, reject) => {
      loader.load(FOLIAGE_PACK_URL, (gltf) => {
        try {
          const templates = extractFoliageTemplates(gltf);
          templates._typeWeights = buildFoliageTypeWeights(templates);
          resolve(templates);
        } catch (err) {
          reject(err);
        }
      }, undefined, reject);
    });
  }
  return forestTemplatesPromise;
}

function terrainSmoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function worldToTerrainGrid(entry, x, z) {
  const half = TERRAIN_SIZE / 2;
  const mesh = entry?.mesh;
  const lx = x - (mesh?.position.x ?? 0);
  const lz = z - (mesh?.position.z ?? 0);
  // PlaneGeometry stores verts as (x, -y, 0); after rotateX(-PI/2), row 0 → -Z, last → +Z.
  const gx = (lx + half) / TERRAIN_SIZE;
  const gz = (lz + half) / TERRAIN_SIZE;
  if (gx < 0 || gx > 1 || gz < 0 || gz > 1) return null;
  return { gx, gz };
}

function sampleForestGuideStep(entry, x, z) {
  const guide = entry?.forestGuide;
  if (!guide?.steps) return -1;
  const grid = worldToTerrainGrid(entry, x, z);
  if (!grid) return -1;
  const px = Math.min(Math.floor(grid.gx * guide.width), guide.width - 1);
  // Match heightmap image orientation: gz=0 is the top row of the PNG.
  const py = Math.min(Math.floor(grid.gz * guide.height), guide.height - 1);
  return guide.steps[py * guide.width + px];
}

function isForestTerrain(entry, x, z, surfaceY, waterY) {
  if (sampleForestGuideStep(entry, x, z) !== FOREST_SPAWN_GUIDE_STEP) return false;
  return surfaceY > waterY + TERRAIN_FOREST_WATER_CLEARANCE;
}

async function loadImagePixelData(url) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = () => reject(new Error(`Failed to load image: ${url}`));
    img.src = url;
  });
  const cv = document.createElement('canvas');
  cv.width = img.width;
  cv.height = img.height;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  return {
    width: img.width,
    height: img.height,
    data: ctx.getImageData(0, 0, img.width, img.height).data,
  };
}

function buildForestSpawnGuide(pixelData) {
  const { width, height, data } = pixelData;
  const steps = new Uint8Array(width * height);
  for (let i = 0, p = 0; i < steps.length; i++, p += 4) {
    const luma = (data[p] + data[p + 1] + data[p + 2]) / 3;
    steps[i] = Math.round((luma / 255) * FOREST_SPAWN_GUIDE_MAX_STEP);
  }
  return { width, height, steps };
}

function sampleTerrainSurface(entry, x, z) {
  if (!entry?.mesh?.geometry) return null;
  const pos = entry.mesh.geometry.attributes.position;
  const heightNormAttr = entry.mesh.geometry.attributes.heightNorm;
  const segments = entry._gridSegments;
  if (!segments || !heightNormAttr) return null;

  const grid = worldToTerrainGrid(entry, x, z);
  if (!grid) return null;
  const { gx, gz } = grid;

  const fx = gx * segments;
  const fz = gz * segments;
  const ix = Math.min(Math.floor(fx), segments - 1);
  const iz = Math.min(Math.floor(fz), segments - 1);
  const tx = fx - ix;
  const tz = fz - iz;
  const stride = segments + 1;
  const idx = (col, row) => row * stride + col;

  const i00 = idx(ix, iz);
  const i10 = idx(ix + 1, iz);
  const i01 = idx(ix, iz + 1);
  const i11 = idx(ix + 1, iz + 1);

  const sampleY = (i) => pos.getY(i);
  const sampleH = (i) => heightNormAttr.array[i];
  // Bilinear sample — matches continuous terrain height better for placement.
  const y = THREE.MathUtils.lerp(
    THREE.MathUtils.lerp(sampleY(i00), sampleY(i10), tx),
    THREE.MathUtils.lerp(sampleY(i01), sampleY(i11), tx),
    tz,
  );
  const heightNorm = THREE.MathUtils.lerp(
    THREE.MathUtils.lerp(sampleH(i00), sampleH(i10), tx),
    THREE.MathUtils.lerp(sampleH(i01), sampleH(i11), tx),
    tz,
  );
  return { y: y + entry.mesh.position.y, heightNorm };
}

function terrainForestChunkKey(x, z) {
  const cx = Math.floor(x / TERRAIN_FOREST_CHUNK_SIZE);
  const cz = Math.floor(z / TERRAIN_FOREST_CHUNK_SIZE);
  return `${cx},${cz}`;
}

function addTreeToChunkBin(chunkBins, tree) {
  const key = terrainForestChunkKey(tree.x, tree.z);
  if (!chunkBins.has(key)) chunkBins.set(key, []);
  chunkBins.get(key).push(tree);
}

function buildTerrainForestChunkGroup(trees, renderTemplates) {
  const group = new THREE.Group();
  const typeCount = renderTemplates.length;
  const buckets = Array.from({ length: typeCount }, () => []);

  for (const tree of trees) {
    buckets[tree.type % typeCount].push(tree);
  }

  const meshes = [];
  for (let ti = 0; ti < typeCount; ti++) {
    const instances = buckets[ti];
    if (!instances.length) continue;
    const { parts } = renderTemplates[ti];
    for (const part of parts) {
      const mesh = new THREE.InstancedMesh(part.geometry, part.material, instances.length);
      mesh.frustumCulled = true;
      mesh.castShadow = false;
      mesh.receiveShadow = false;
      const arr = mesh.instanceMatrix.array;
      for (let j = 0; j < instances.length; j++) {
        const inst = instances[j];
        _dummy.position.set(inst.x, inst.y, inst.z);
        _dummy.rotation.set(0, inst.spin, 0);
        _dummy.scale.setScalar(inst.scale);
        _dummy.updateMatrix();
        _dummy.matrix.toArray(arr, j * 16);
      }
      mesh.instanceMatrix.needsUpdate = true;
      mesh.computeBoundingSphere();
      if (mesh.boundingSphere) mesh.boundingSphere.radius *= 1.15;
      group.add(mesh);
      meshes.push(mesh);
    }
  }

  group.userData.instancedMeshes = meshes;
  return group;
}

function disposeTerrainForestChunkGroup(group) {
  group.traverse((child) => {
    if (!child.isInstancedMesh) return;
    // Geometry/materials are owned by shared forest templates — only free instance data.
    child.dispose();
  });
}

function disposeTerrainForestSystem(system) {
  if (!system) return;
  for (const chunk of system.builtChunks.values()) {
    disposeTerrainForestChunkGroup(chunk.group);
  }
  system.root.removeFromParent();
}

async function buildAllTerrainForestChunksAsync(system, generation) {
  const keys = [...system.chunkBins.keys()];
  let index = 0;
  const total = keys.length;
  let builtTrees = 0;

  await new Promise((resolve) => {
    const step = () => {
      if (generation !== terrainForestBuildGeneration) {
        resolve(false);
        return;
      }
      const start = performance.now();
      while (index < keys.length && performance.now() - start < TERRAIN_FOREST_BUILD_BATCH_MS) {
        const key = keys[index];
        const trees = system.chunkBins.get(key);
        const group = buildTerrainForestChunkGroup(trees, system.templates);
        prepareMeshes(group);
        system.builtChunks.set(key, { key, trees, group });
        system.root.add(group);
        system.instancedMeshes.push(...group.userData.instancedMeshes);
        builtTrees += trees.length;
        index++;
      }
      if (total > 0) {
        const pct = Math.round((index / total) * 100);
        loadingMgr.set('Forest build', 'Loading', `${pct}% · ${builtTrees.toLocaleString()} trees`);
      }
      if (index >= keys.length) {
        resolve(true);
        return;
      }
      requestAnimationFrame(step);
    };
    step();
  });

  return generation === terrainForestBuildGeneration;
}

function getForestDensityNoise(seed) {
  if (!forestDensityNoise) forestDensityNoise = new PerlinNoise(seed + 42069);
  else forestDensityNoise.setSeed(seed + 42069);
  return forestDensityNoise;
}

function forestRegionDensity(x, z, seed) {
  const fn = getForestDensityNoise(seed);
  const inv = 1 / Math.max(TERRAIN_SIZE, 1);
  // Two-scale noise keeps clearings vs stands without 3 expensive FBMs per attempt.
  const region = fn.fbm(x * inv * 1.35 + seed * 0.017, z * inv * 1.35 + seed * 0.031, 3, 2.05, 0.55);
  const grove = fn.fbm(x * inv * 7.2 + 40, z * inv * 7.2 + 70, 2, 2.2, 0.5);
  const regionNorm = region * 0.5 + 0.5;
  const groveNorm = grove * 0.5 + 0.5;
  if (regionNorm < TERRAIN_FOREST_BARE_CUTOFF) return 0;
  const regionWeight = terrainSmoothstep(TERRAIN_FOREST_BARE_CUTOFF, 0.78, regionNorm);
  const groveWeight = terrainSmoothstep(0.28, 0.84, groveNorm);
  const stand = regionWeight * regionWeight * (0.2 + groveWeight * groveWeight * 0.8);
  return Math.min(1, stand * 1.35);
}

function forestPlacementChance(density) {
  if (density <= 0) return 0;
  // Patchy, but dense stands place reliably so fill doesn't thrash.
  return Math.min(1, density ** 1.35 * 0.98);
}

function collectForestGuideZoneIndices(guide, step = FOREST_SPAWN_GUIDE_STEP) {
  const steps = guide?.steps;
  if (!steps) return new Uint32Array(0);
  let count = 0;
  for (let i = 0; i < steps.length; i++) if (steps[i] === step) count++;
  const idxs = new Uint32Array(count);
  for (let i = 0, n = 0; i < steps.length; i++) {
    if (steps[i] === step) idxs[n++] = i;
  }
  return idxs;
}

function worldFromForestGuideIndex(entry, index, rng) {
  const guide = entry.forestGuide;
  const w = guide.width;
  const h = guide.height;
  const px = index % w;
  const py = (index / w) | 0;
  const gx = (px + (rng ? rng() : 0.5)) / w;
  const gz = (py + (rng ? rng() : 0.5)) / h;
  const half = TERRAIN_SIZE * 0.5;
  const mesh = entry.mesh;
  return {
    x: gx * TERRAIN_SIZE - half + (mesh?.position.x ?? 0),
    z: gz * TERRAIN_SIZE - half + (mesh?.position.z ?? 0),
  };
}

function createFoliageSpacingGrid() {
  // Separate layers so tree spacing never forces a huge neighbor search over tiny grass cells.
  return {
    tree: {
      cellSize: FOLIAGE_MIN_SPACING.tree,
      minDistSq: (FOLIAGE_MIN_SPACING.tree * 0.92) ** 2,
      cells: new Map(),
    },
    ground: {
      cellSize: Math.min(
        FOLIAGE_MIN_SPACING.grass,
        FOLIAGE_MIN_SPACING.flower,
        FOLIAGE_MIN_SPACING.plant,
      ),
      minDistSq: (Math.min(
        FOLIAGE_MIN_SPACING.grass,
        FOLIAGE_MIN_SPACING.flower,
        FOLIAGE_MIN_SPACING.plant,
      ) * 0.92) ** 2,
      cells: new Map(),
    },
  };
}

function foliageSpacingLayer(grid, category) {
  return category === 'tree' ? grid.tree : grid.ground;
}

function foliageCellKey(cx, cz) {
  // Pack cell coords; terrain/cell counts stay well inside this range.
  return (cx + 500000) * 1000003 + (cz + 500000);
}

function foliageSpacingFits(grid, x, z, category) {
  const layer = foliageSpacingLayer(grid, category);
  const cell = layer.cellSize;
  const cx = Math.floor(x / cell);
  const cz = Math.floor(z / cell);
  const minDistSq = layer.minDistSq;
  for (let dz = -1; dz <= 1; dz++) {
    for (let dx = -1; dx <= 1; dx++) {
      const bucket = layer.cells.get(foliageCellKey(cx + dx, cz + dz));
      if (!bucket) continue;
      for (let i = 0, n = bucket.length; i < n; i += 2) {
        const ddx = bucket[i] - x;
        const ddz = bucket[i + 1] - z;
        if (ddx * ddx + ddz * ddz < minDistSq) return false;
      }
    }
  }
  return true;
}

function registerFoliageSpacing(grid, x, z, category) {
  const layer = foliageSpacingLayer(grid, category);
  const cell = layer.cellSize;
  const key = foliageCellKey(Math.floor(x / cell), Math.floor(z / cell));
  let bucket = layer.cells.get(key);
  if (!bucket) {
    bucket = [];
    layer.cells.set(key, bucket);
  }
  bucket.push(x, z);
}

function scatterDenseClump(entry, x, z, density, spacing, cellRng, chunkBins, waterY, countRef, targetCount, seed, templates, spacingGrid) {
  const spread = Math.max(FOLIAGE_MIN_SPACING.tree * 2.2, spacing * 0.55);
  const extraCount = Math.floor(2 + density * density * 10);
  const jitter = Math.min(spacing * (0.35 + density * 0.45), spread);
  for (let e = 0; e < extraCount && countRef.value < targetCount; e++) {
    const jx = x + (cellRng() - 0.5) * jitter;
    const jz = z + (cellRng() - 0.5) * jitter;
    if (forestRegionDensity(jx, jz, seed) < density * 0.35) continue;
    tryPlaceForestTree(entry, jx, jz, cellRng, chunkBins, waterY, countRef, templates, spacingGrid);
  }
}

function tryPlaceForestTree(entry, x, z, cellRng, chunkBins, waterY, countRef, templates, spacingGrid, stats = null, skipGuideCheck = false) {
  // Guide first — cheapest reject for off-zone / clump jitter.
  if (!skipGuideCheck && sampleForestGuideStep(entry, x, z) !== FOREST_SPAWN_GUIDE_STEP) {
    if (stats) {
      stats.samples++;
      stats.outOfBand++;
    }
    return false;
  }

  if (spacingGrid && !foliageSpacingFits(spacingGrid, x, z, 'tree')) {
    return false;
  }

  const sample = sampleTerrainSurface(entry, x, z);
  if (stats) {
    stats.samples++;
    if (!sample) {
      stats.noSample++;
      return false;
    }
    stats.minH = Math.min(stats.minH, sample.heightNorm);
    stats.maxH = Math.max(stats.maxH, sample.heightNorm);
    if (sample.y <= waterY + TERRAIN_FOREST_WATER_CLEARANCE) {
      stats.underwater++;
      return false;
    }
    stats.ok++;
  } else if (!sample || sample.y <= waterY + TERRAIN_FOREST_WATER_CLEARANCE) {
    return false;
  }

  const type = pickFoliageType(templates._typeWeights, cellRng);
  const tmpl = templates[type];
  const scale = THREE.MathUtils.lerp(tmpl.scaleMin, tmpl.scaleMax, cellRng());
  addTreeToChunkBin(chunkBins, {
    x,
    y: sample.y,
    z,
    scale,
    spin: cellRng() * Math.PI * 2,
    type,
  });
  if (spacingGrid) registerFoliageSpacing(spacingGrid, x, z, 'tree');
  countRef.value++;
  return true;
}

async function generateMegaForestPlacementsAsync(entry, targetCount, seed, generation, templates) {
  const waterY = entry.waterMesh?.position.y ?? HEIGHT_SCALE * TERRAIN_WATER_HEIGHT_NORM;
  const zoneIdx = collectForestGuideZoneIndices(entry.forestGuide);
  const zoneCount = zoneIdx.length;
  if (!zoneCount) {
    console.warn('Forest guide has no zone-4 cells');
    return { chunkBins: new Map(), count: 0, waterY };
  }

  const guide = entry.forestGuide;
  const zoneFrac = zoneCount / Math.max(1, guide.width * guide.height);
  const zoneArea = (TERRAIN_SIZE * TERRAIN_SIZE) * zoneFrac;
  // Space against zone area only — avoids a huge empty world grid + endless fill.
  const spacing = Math.sqrt(zoneArea / Math.max(1, targetCount * 1.05));
  const chunkBins = new Map();
  const countRef = { value: 0 };
  const spacingGrid = createFoliageSpacingGrid();
  const stats = { samples: 0, ok: 0, noSample: 0, underwater: 0, outOfBand: 0, minH: 1, maxH: 0, zoneCount };

  // Visit ~1.35x target zone cells so density + spacing can reject without a long fill.
  const visitCount = Math.min(zoneCount, Math.ceil(targetCount * 1.35));
  const stride = Math.max(1, Math.floor(zoneCount / visitCount));
  let visit = 0;

  const tryPlaceAt = (x, z, cellRng, withStats, allowClump) => {
    const density = forestRegionDensity(x, z, seed);
    if (density <= 0 || cellRng() > forestPlacementChance(density)) return false;
    if (!tryPlaceForestTree(
      entry, x, z, cellRng, chunkBins, waterY, countRef, templates, spacingGrid,
      withStats ? stats : null, true,
    )) return false;
    if (allowClump && density > 0.45) {
      scatterDenseClump(
        entry, x, z, density, spacing, cellRng, chunkBins, waterY,
        countRef, targetCount, seed, templates, spacingGrid,
      );
    }
    return true;
  };

  await new Promise((resolve) => {
    const step = () => {
      if (generation !== terrainForestBuildGeneration) {
        resolve(false);
        return;
      }
      const start = performance.now();
      while (
        visit < visitCount
        && countRef.value < targetCount
        && performance.now() - start < TERRAIN_FOREST_PLACEMENT_BATCH_MS
      ) {
        const cellI = Math.min(zoneCount - 1, visit * stride);
        const cellRng = mulberry32(seed + zoneIdx[cellI] * 2654435761);
        const { x, z } = worldFromForestGuideIndex(entry, zoneIdx[cellI], cellRng);
        tryPlaceAt(x, z, cellRng, true, true);
        visit++;
      }
      const pct = Math.min(99, Math.round((countRef.value / Math.max(1, targetCount)) * 100));
      loadingMgr.set('Forest placement', 'Loading', `${pct}% · ${countRef.value.toLocaleString()}`);
      if (countRef.value >= targetCount || visit >= visitCount) {
        resolve(true);
        return;
      }
      requestAnimationFrame(step);
    };
    step();
  });

  if (generation !== terrainForestBuildGeneration) return null;

  if (countRef.value < targetCount) {
    const fillRng = mulberry32(seed + 99991);
    let fillAttempts = 0;
    const fillMax = Math.min(targetCount * 6, zoneCount * 2);
    await new Promise((resolve) => {
      const step = () => {
        if (generation !== terrainForestBuildGeneration) {
          resolve();
          return;
        }
        const start = performance.now();
        while (
          countRef.value < targetCount
          && fillAttempts < fillMax
          && performance.now() - start < TERRAIN_FOREST_PLACEMENT_BATCH_MS
        ) {
          fillAttempts++;
          const idx = zoneIdx[(fillRng() * zoneCount) | 0];
          const { x, z } = worldFromForestGuideIndex(entry, idx, fillRng);
          tryPlaceAt(x, z, fillRng, false, true);
        }
        const pct = Math.min(99, Math.round((countRef.value / Math.max(1, targetCount)) * 100));
        loadingMgr.set('Forest placement', 'Loading', `Fill ${pct}% · ${countRef.value.toLocaleString()}`);
        if (countRef.value >= targetCount || fillAttempts >= fillMax) {
          resolve();
          return;
        }
        requestAnimationFrame(step);
      };
      step();
    });
  }

  if (countRef.value < targetCount) {
    const topUpRng = mulberry32(seed + 77777);
    let topUpAttempts = 0;
    const need = targetCount - countRef.value;
    const topUpMax = Math.min(need * 8, zoneCount);
    await new Promise((resolve) => {
      const step = () => {
        if (generation !== terrainForestBuildGeneration) {
          resolve();
          return;
        }
        const start = performance.now();
        while (
          countRef.value < targetCount
          && topUpAttempts < topUpMax
          && performance.now() - start < TERRAIN_FOREST_PLACEMENT_BATCH_MS
        ) {
          topUpAttempts++;
          const idx = zoneIdx[(topUpRng() * zoneCount) | 0];
          const { x, z } = worldFromForestGuideIndex(entry, idx, topUpRng);
          const density = forestRegionDensity(x, z, seed);
          if (density < 0.32 || topUpRng() > forestPlacementChance(density)) continue;
          tryPlaceForestTree(
            entry, x, z, topUpRng, chunkBins, waterY, countRef, templates, spacingGrid,
            null, true,
          );
        }
        if (countRef.value >= targetCount || topUpAttempts >= topUpMax) {
          resolve();
          return;
        }
        requestAnimationFrame(step);
      };
      step();
    });
  }

  if (generation !== terrainForestBuildGeneration) return null;
  console.info(`Forest placed ${countRef.value.toLocaleString()} / ${targetCount.toLocaleString()} trees`, stats);
  window.__forestDebug = { count: countRef.value, target: targetCount, waterY, stats, zoneFrac };
  return { chunkBins, count: countRef.value, waterY };
}

function pickForestSpawnTree(chunkBins, templates) {
  let bestTrees = null;
  for (const trees of chunkBins.values()) {
    if (!bestTrees || trees.length > bestTrees.length) bestTrees = trees;
  }
  if (!bestTrees?.length) return null;
  const treeTypes = new Set(
    (templates || [])
      .map((t, i) => (t.category === 'tree' ? i : -1))
      .filter((i) => i >= 0),
  );
  const candidates = treeTypes.size
    ? bestTrees.filter((t) => treeTypes.has(t.type))
    : bestTrees;
  const pool = candidates.length ? candidates : bestTrees;
  const cx = pool.reduce((s, t) => s + t.x, 0) / pool.length;
  const cz = pool.reduce((s, t) => s + t.z, 0) / pool.length;
  let best = pool[0];
  let bestDist = Infinity;
  for (const tree of pool) {
    const d = (tree.x - cx) ** 2 + (tree.z - cz) ** 2;
    if (d < bestDist) {
      bestDist = d;
      best = tree;
    }
  }
  return best;
}

function findForestSpawn(entry, seed) {
  const waterY = entry.waterMesh?.position.y ?? 0;
  const rng = mulberry32(seed + 54321);
  let best = null;
  let bestScore = -1;
  const radius = TERRAIN_SIZE * 0.08;
  for (let i = 0; i < 400; i++) {
    const x = (rng() * 2 - 1) * radius;
    const z = (rng() * 2 - 1) * radius;
    const density = forestRegionDensity(x, z, seed);
    if (density < 0.2) continue;
    const sample = sampleTerrainSurface(entry, x, z);
    if (!sample || !isForestTerrain(entry, x, z, sample.y, waterY)) continue;
    const score = density * sample.heightNorm;
    if (score > bestScore) {
      bestScore = score;
      best = { x, z, y: sample.y };
    }
  }
  return best;
}

async function buildTerrainForest() {
  if (!terrainEntry) return;

  terrainForestBuildGeneration++;
  const generation = terrainForestBuildGeneration;

  if (terrainForestSystem) {
    disposeTerrainForestSystem(terrainForestSystem);
    terrainForestSystem = null;
  }

  loadingMgr.set('Forest models', 'Loading');
  const templates = await loadForestTreeTemplates();
  loadingMgr.set('Forest models', 'Complete');
  if (generation !== terrainForestBuildGeneration) return;

  loadingMgr.set('Forest placement', 'Loading');
  const result = await generateMegaForestPlacementsAsync(
    terrainEntry,
    FOREST_TREE_COUNT,
    FOREST_SEED,
    generation,
    templates,
  );
  if (!result || generation !== terrainForestBuildGeneration) return;
  loadingMgr.set('Forest placement', 'Complete', `${result.count.toLocaleString()} trees`);

  const system = {
    root: new THREE.Group(),
    chunkBins: result.chunkBins,
    builtChunks: new Map(),
    templates,
    instancedMeshes: [],
    totalCount: result.count,
    spawnTree: pickForestSpawnTree(result.chunkBins, templates),
  };

  terrainForestSystem = system;
  terrainGroup.add(system.root);

  loadingMgr.set('Forest build', 'Loading', `0 / ${result.count.toLocaleString()}`);
  await buildAllTerrainForestChunksAsync(system, generation);
  loadingMgr.set('Forest build', 'Complete', `${result.count.toLocaleString()} trees`);
  window.__forestDebug = {
    ...(window.__forestDebug || {}),
    chunks: system.builtChunks.size,
    meshes: system.instancedMeshes.length,
    spawn: system.spawnTree,
    totalCount: system.totalCount,
  };
}

// ---------- Helpers ----------

function inPlaceClip(clip) {
  const tracks = clip.tracks.map((t) => {
    if (t.name.includes('Hips') && t.name.endsWith('.position')) {
      const values = t.values.slice();
      const x0 = values[0], z0 = values[2];
      for (let i = 0; i < values.length; i += 3) { values[i] = x0; values[i + 2] = z0; }
      return new THREE.VectorKeyframeTrack(t.name, t.times.slice(), values);
    }
    return t;
  });
  return new THREE.AnimationClip(clip.name + '_inplace', clip.duration, tracks);
}

function centerModel(model) {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  model.position.x -= center.x;
  model.position.z -= center.z;
  model.position.y -= box.min.y;
  return { size, height: size.y };
}

// ---------- Animation ----------

function fadeToAction(next, duration) {
  next.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).play();
  if (character.currentAction && character.currentAction !== next) {
    character.currentAction.crossFadeTo(next, duration, false);
  }
  character.currentAction = next;
}

function setGameplayState(state) {
  character.state = state;
  fadeToAction(character.actions[state], CROSSFADE);
}

function triggerOneShot(name) {
  if (character.oneShot) return;
  character.oneShot = name;
  character.state = name;
  fadeToAction(character.actions[name], 0.15);
}

const _dir = new THREE.Vector3();

function triggerJump() {
  if (character.oneShot || character.airborne) return;
  character.vy = JUMP_VELOCITY;
  character.airborne = true;
  triggerOneShot('jump');
}

function triggerRoll() {
  if (character.oneShot || character.airborne) return;
  if (inputDirection(_dir)) {
    character.rollDir.copy(_dir);
    character.group.rotation.y = Math.atan2(_dir.x, _dir.z);
  } else {
    const a = character.group.rotation.y;
    character.rollDir.set(Math.sin(a), 0, Math.cos(a));
  }
  triggerOneShot('roll');
}

// ---------- Movement ----------

const _forward = new THREE.Vector3();
const _right = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0);

function inputDirection(out) {
  camera.getWorldDirection(_forward);
  _forward.y = 0;
  _forward.normalize();
  _right.crossVectors(_forward, _up).normalize();
  out.set(0, 0, 0)
    .addScaledVector(_forward, (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0))
    .addScaledVector(_right, (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0));
  if (out.lengthSq() < 1e-6) return false;
  out.normalize();
  return true;
}

function moveGroup(dir, speed, delta) {
  const pos = character.group.position;
  pos.addScaledVector(dir, speed * delta);
  pos.x = THREE.MathUtils.clamp(pos.x, -FLOOR_BOUND, FLOOR_BOUND);
  pos.z = THREE.MathUtils.clamp(pos.z, -FLOOR_BOUND, FLOOR_BOUND);
}

function faceDirection(dir, delta) {
  const targetAngle = Math.atan2(dir.x, dir.z);
  let diff = targetAngle - character.group.rotation.y;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  character.group.rotation.y += diff * Math.min(1, ROTATION_LERP * delta);
}

function updateGameplay(delta) {
  if (character.oneShot === 'roll') {
    moveGroup(character.rollDir, ROLL_SPEED, delta);
    return;
  }
  if (character.airborne) {
    if (character.oneShot !== 'jump' && isMoving() && inputDirection(_dir)) {
      moveGroup(_dir, WALK_SPEED * 0.55, delta);
      faceDirection(_dir, delta);
    }
    return;
  }
  if (character.oneShot) return;
  const moving = isMoving();
  if (character.state !== (moving ? 'walk' : 'idle')) setGameplayState(moving ? 'walk' : 'idle');
  if (!moving) return;
  if (!inputDirection(_dir)) return;
  moveGroup(_dir, WALK_SPEED, delta);
  faceDirection(_dir, delta);
}

function snapToGround() {
  const pos = character.group.position;
  const h = sampleTerrainHeight(pos.x, pos.z);
  if (h === null) return false;
  pos.y = h + groundOffsetY();
  return true;
}

function updateVertical(delta) {
  const pos = character.group.position;
  if (!character.airborne) return false;
  character.vy -= JUMP_GRAVITY * delta;
  pos.y += character.vy * delta;
  const ground = sampleTerrainHeight(pos.x, pos.z);
  const floorY = ground === null ? null : ground + groundOffsetY();
  if (floorY !== null && pos.y <= floorY && character.vy <= 0) {
    pos.y = floorY;
    character.vy = 0;
    character.airborne = false;
    if (!character.oneShot) setGameplayState(isMoving() ? 'walk' : 'idle');
  }
  return true;
}

function updateSunShadow() {
  if (!character) return;
  const pos = character.group.position;
  const reach = Math.max(220, character.height * 48);
  sun.target.position.copy(pos);
  sun.position.copy(pos).addScaledVector(skySunDir, reach * 2.8);
  const cam = sun.shadow.camera;
  cam.left = -reach;
  cam.right = reach;
  cam.top = reach;
  cam.bottom = -reach;
  cam.near = 1;
  cam.far = reach * 5;
  cam.updateProjectionMatrix();
}

function isMoving() {
  return keys.KeyW || keys.KeyA || keys.KeyS || keys.KeyD;
}

// ---------- Camera ----------

const TARGET_Y_LERP = 8;
const CAMERA_TARGET_HEIGHT = 0.88;
const MAP_DISTANCE = TERRAIN_SIZE * 1.15;
const _camDelta = new THREE.Vector3();
const _camRayDir = new THREE.Vector3();
let mapView = false;

function cameraTargetY(pos, h) {
  return pos.y + h * CAMERA_TARGET_HEIGHT;
}

function frameCameraChar() {
  const h = character.height;
  const pos = character.group.position;
  const targetY = cameraTargetY(pos, h);
  controls.target.set(pos.x, targetY, pos.z);
  camera.position.set(pos.x, targetY + h, pos.z - h * 3);
  controls.minDistance = Math.max(5, h * 0.8);
  controls.maxDistance = Math.max(h * 20, controls.minDistance + 1);
  controls.minPolarAngle = 0;
  controls.maxPolarAngle = Math.PI * 0.49;
  camera.near = Math.max(0.1, h * 0.1);
  camera.updateProjectionMatrix();
  resolveCameraCollision(h);
  syncSkyToCamera();
}

function setMapView(open) {
  if (!character || mapView === open) return;
  mapView = open;
  keys.KeyW = keys.KeyA = keys.KeyS = keys.KeyD = false;
  if (open) {
    const mapY = HEIGHT_SCALE * 0.3;
    controls.target.set(0, mapY, 0);
    camera.position.set(0, mapY + MAP_DISTANCE, 1);
    controls.minDistance = MAP_DISTANCE * 0.35;
    controls.maxDistance = MAP_DISTANCE * 1.4;
    controls.minPolarAngle = 0;
    controls.maxPolarAngle = Math.PI * 0.35;
    controls.enablePan = true;
    controls.enableRotate = false;
    controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: null };
    syncSkyToCamera();
  } else {
    controls.enablePan = false;
    controls.enableRotate = true;
    controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: null };
    frameCameraChar();
  }
}

function resolveCameraCollision(h) {
  if (!terrainMesh || mapView) return;
  const target = controls.target;
  const dist = camera.position.distanceTo(target);
  if (dist < 1e-6) return;
  _camRayDir.copy(camera.position).sub(target).multiplyScalar(1 / dist);
  _ray.set(target, _camRayDir);
  _ray.far = dist;
  const hits = _ray.intersectObject(terrainMesh, false);
  if (hits.length === 0) return;
  const pad = Math.max(0.5, h * 0.15);
  const safeDist = Math.max(controls.minDistance, hits[0].distance - pad);
  camera.position.copy(target).addScaledVector(_camRayDir, safeDist);
}

function followCamera(delta) {
  if (mapView) return;
  const h = character.height;
  const pos = character.group.position;
  const idealTargetY = cameraTargetY(pos, h);
  _camDelta.set(
    pos.x - controls.target.x,
    (idealTargetY - controls.target.y) * Math.min(1, TARGET_Y_LERP * delta),
    pos.z - controls.target.z,
  );
  if (_camDelta.lengthSq() < 1e-10) return;
  camera.position.add(_camDelta);
  controls.target.add(_camDelta);
}

function updateCameraCollision() {
  if (!character || mapView) return;
  resolveCameraCollision(character.height);
}

// ---------- Input ----------

window.addEventListener('keydown', (e) => {
  if (!character) return;
  if (e.code === 'KeyM' && !e.repeat) { setMapView(!mapView); return; }
  if (e.code === 'Escape' && mapView) { setMapView(false); return; }
  if (mapView) return;
  if (e.code in keys) { keys[e.code] = true; return; }
  if (e.repeat) return;
  if (e.code === 'Space') { e.preventDefault(); triggerJump(); }
  else if (e.code === 'ControlLeft' || e.code === 'ControlRight') { e.preventDefault(); triggerRoll(); }
});

window.addEventListener('keyup', (e) => {
  if (e.code in keys) keys[e.code] = false;
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Terrain textures ----------

const TERRAIN_TEXTURE_REFERENCE_SIZE = 8000;
const TERRAIN_TEXTURE_SCALE = 48;
const TERRAIN_TEXTURE_REPEAT = TERRAIN_TEXTURE_SCALE * (TERRAIN_SIZE / TERRAIN_TEXTURE_REFERENCE_SIZE);
const TERRAIN_HEX_TILING = {
  patchScale: 2,
  useContrastCorrectedBlending: false,
  lookupSkipThreshold: 0.08,
  textureSampleCoefficientExponent: 6,
  layerWeightMin: 0.02,
};
const terrainTextureLoader = new THREE.TextureLoader();

function configureTerrainTexture(tex, colorSpace) {
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(TERRAIN_TEXTURE_REPEAT, TERRAIN_TEXTURE_REPEAT);
  tex.colorSpace = colorSpace;
  tex.anisotropy = 8;
  return tex;
}

function loadTerrainTexture(url, colorSpace) {
  return new Promise((resolve, reject) => {
    terrainTextureLoader.load(
      url,
      (tex) => resolve(configureTerrainTexture(tex, colorSpace)),
      undefined,
      () => reject(new Error(`Failed to load texture: ${url}`)),
    );
  });
}

async function loadTerrainTextureSet(prefix) {
  const base = `./textures/${prefix}`;
  const [color, normal, roughness, ao] = await Promise.all([
    loadTerrainTexture(`${base}_Color.jpg`, THREE.SRGBColorSpace),
    loadTerrainTexture(`${base}_NormalGL.jpg`, THREE.NoColorSpace),
    loadTerrainTexture(`${base}_Roughness.jpg`, THREE.NoColorSpace),
    loadTerrainTexture(`${base}_AmbientOcclusion.jpg`, THREE.NoColorSpace),
  ]);
  return { color, normal, roughness, ao };
}

let terrainTextureSetsPromise = null;

function loadTerrainTextureSets() {
  if (!terrainTextureSetsPromise) {
    terrainTextureSetsPromise = Promise.all([
      loadTerrainTextureSet('Ground103_2K-JPG'),
      loadTerrainTextureSet('Ground037_2K-JPG'),
      loadTerrainTextureSet('Snow015_2K-JPG'),
      loadTerrainTextureSet('Snow014_2K-JPG'),
    ]).then(([sand, grass, stone, snow]) => ({ sand, grass, stone, snow }));
  }
  return terrainTextureSetsPromise;
}

const TERRAIN_BLEND_GLSL = `
#define rnd22(p) fract(sin((p) * mat2(127.1, 311.7, 269.5, 183.3)) * 43758.5453)
#define srgb2rgb(V) pow(max(V, 0.0), vec4(2.2))
#define rgb2srgb(V) pow(max(V, 0.0), vec4(1.0 / 2.2))

uniform bool hexTilingUseContrastCorrectedBlending;
uniform float hexTilingPatchScale;
uniform float hexTilingLookupSkipThreshold;
uniform float hexTilingTextureSampleCoefficientExponent;
uniform float terrainLayerWeightMin;
uniform sampler2D uNormSand, uNormGrass, uNormStone, uNormSnow;
uniform sampler2D uRoughSand, uRoughGrass, uRoughStone, uRoughSnow;
uniform sampler2D uAoSand, uAoGrass, uAoStone, uAoSnow;

float terrainHash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}
float terrainNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = terrainHash(i);
  float b = terrainHash(i + vec2(1.0, 0.0));
  float c = terrainHash(i + vec2(0.0, 1.0));
  float d = terrainHash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
vec4 hexTileSample(sampler2D samp, vec2 tileIndex, vec2 U, vec2 Gx, vec2 Gy, vec4 meanColor) {
  return srgb2rgb(textureGrad(samp, U / hexTilingPatchScale - rnd22(tileIndex), Gx, Gy))
    - meanColor * float(hexTilingUseContrastCorrectedBlending);
}
vec4 textureNoTileNeyret(sampler2D samp, vec2 uv) {
  mat2 M = inverse(mat2(1.0, 0.0, 0.5, sqrt(3.0) / 2.0));
  vec2 U = uv * hexTilingPatchScale / 8.0 * exp2(4.0 * 0.2 + 1.0);
  vec2 V = M * U;
  vec2 I = floor(V);
  vec2 Gx = dFdx(U / hexTilingPatchScale);
  vec2 Gy = dFdy(U / hexTilingPatchScale);
  vec4 meanColor = hexTilingUseContrastCorrectedBlending ? srgb2rgb(texture2D(samp, U)) : vec4(0.0);
  vec3 F = vec3(fract(V), 0.0);
  F.z = 1.0 - F.x - F.y;
  vec4 fragColor = vec4(0.0);
  vec3 W;
  if (F.z > 0.0) {
    W = vec3(F.z, F.y, F.x);
    W = pow(W, vec3(hexTilingTextureSampleCoefficientExponent));
    W /= dot(W, vec3(1.0));
    if (W.x > hexTilingLookupSkipThreshold) fragColor += hexTileSample(samp, I, U, Gx, Gy, meanColor) * W.x;
    if (W.y > hexTilingLookupSkipThreshold) fragColor += hexTileSample(samp, I + vec2(0.0, 1.0), U, Gx, Gy, meanColor) * W.y;
    if (W.z > hexTilingLookupSkipThreshold) fragColor += hexTileSample(samp, I + vec2(1.0, 0.0), U, Gx, Gy, meanColor) * W.z;
  } else {
    W = vec3(-F.z, 1.0 - F.y, 1.0 - F.x);
    W = pow(W, vec3(hexTilingTextureSampleCoefficientExponent));
    W /= dot(W, vec3(1.0));
    if (W.x > hexTilingLookupSkipThreshold) fragColor += hexTileSample(samp, I + 1.0, U, Gx, Gy, meanColor) * W.x;
    if (W.y > hexTilingLookupSkipThreshold) fragColor += hexTileSample(samp, I + vec2(1.0, 0.0), U, Gx, Gy, meanColor) * W.y;
    if (W.z > hexTilingLookupSkipThreshold) fragColor += hexTileSample(samp, I + vec2(0.0, 1.0), U, Gx, Gy, meanColor) * W.z;
  }
  fragColor = hexTilingUseContrastCorrectedBlending ? meanColor + fragColor / length(W) : fragColor;
  return clamp(rgb2srgb(fragColor), 0.0, 1.0);
}
vec4 sampleTerrainTex(sampler2D tex, vec2 worldUv) {
  return textureNoTileNeyret(tex, worldUv);
}
vec4 terrainLayerWeights(float h, vec2 mapUv) {
  float blendH = clamp(h + (terrainNoise(mapUv * 0.12) - 0.5) * 0.14, 0.0, 1.0);
  float sg = smoothstep(0.0, 0.40, blendH);
  float gs = smoothstep(0.40, 0.75, blendH);
  float sn = smoothstep(0.75, 1.0, blendH);
  float wSand = (1.0 - sg) * (1.0 - gs) * (1.0 - sn);
  float wGrass = sg * (1.0 - gs) * (1.0 - sn);
  float wStone = gs * (1.0 - sn);
  float wSnow = sn;
  return vec4(wSand, wGrass, wStone, wSnow);
}
vec4 getTerrainColor(vec2 mapUv, float h) {
  vec4 w = terrainLayerWeights(h, mapUv);
  vec4 color = vec4(0.0);
  float wSum = 0.0;
  if (w.x > terrainLayerWeightMin) { color += sampleTerrainTex(uTexSand, mapUv) * w.x; wSum += w.x; }
  if (w.y > terrainLayerWeightMin) { color += sampleTerrainTex(uTexGrass, mapUv) * w.y; wSum += w.y; }
  if (w.z > terrainLayerWeightMin) { color += sampleTerrainTex(uTexStone, mapUv) * w.z; wSum += w.z; }
  if (w.w > terrainLayerWeightMin) { color += sampleTerrainTex(uTexSnow, mapUv) * w.w; wSum += w.w; }
  return color / max(wSum, 1e-3);
}
vec3 getTerrainNormal(vec2 mapUv, float h) {
  vec4 w = terrainLayerWeights(h, mapUv);
  vec3 n = vec3(0.0);
  float wSum = 0.0;
  if (w.x > terrainLayerWeightMin) { n += texture2D(uNormSand, mapUv).xyz * w.x; wSum += w.x; }
  if (w.y > terrainLayerWeightMin) { n += texture2D(uNormGrass, mapUv).xyz * w.y; wSum += w.y; }
  if (w.z > terrainLayerWeightMin) { n += texture2D(uNormStone, mapUv).xyz * w.z; wSum += w.z; }
  if (w.w > terrainLayerWeightMin) { n += texture2D(uNormSnow, mapUv).xyz * w.w; wSum += w.w; }
  return n / max(wSum, 1e-3);
}
float getTerrainRoughness(vec2 mapUv, float h) {
  vec4 w = terrainLayerWeights(h, mapUv);
  float r = 0.0;
  float wSum = 0.0;
  if (w.x > terrainLayerWeightMin) { r += texture2D(uRoughSand, mapUv).r * w.x; wSum += w.x; }
  if (w.y > terrainLayerWeightMin) { r += texture2D(uRoughGrass, mapUv).r * w.y; wSum += w.y; }
  if (w.z > terrainLayerWeightMin) { r += texture2D(uRoughStone, mapUv).r * w.z; wSum += w.z; }
  if (w.w > terrainLayerWeightMin) { r += texture2D(uRoughSnow, mapUv).r * w.w; wSum += w.w; }
  return r / max(wSum, 1e-3);
}
float getTerrainAO(vec2 mapUv, float h) {
  vec4 w = terrainLayerWeights(h, mapUv);
  float a = 0.0;
  float wSum = 0.0;
  if (w.x > terrainLayerWeightMin) { a += texture2D(uAoSand, mapUv).r * w.x; wSum += w.x; }
  if (w.y > terrainLayerWeightMin) { a += texture2D(uAoGrass, mapUv).r * w.y; wSum += w.y; }
  if (w.z > terrainLayerWeightMin) { a += texture2D(uAoStone, mapUv).r * w.z; wSum += w.z; }
  if (w.w > terrainLayerWeightMin) { a += texture2D(uAoSnow, mapUv).r * w.w; wSum += w.w; }
  return a / max(wSum, 1e-3);
}
`;

function applyTerrainTextureBlending(material, sets) {
  material.map = sets.sand.color;
  material.normalMap = sets.sand.normal;
  material.roughnessMap = sets.sand.roughness;
  material.aoMap = sets.sand.ao;
  material.aoMapIntensity = 1.0;

  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTexSand = { value: sets.sand.color };
    shader.uniforms.uTexGrass = { value: sets.grass.color };
    shader.uniforms.uTexStone = { value: sets.stone.color };
    shader.uniforms.uTexSnow = { value: sets.snow.color };
    shader.uniforms.uNormSand = { value: sets.sand.normal };
    shader.uniforms.uNormGrass = { value: sets.grass.normal };
    shader.uniforms.uNormStone = { value: sets.stone.normal };
    shader.uniforms.uNormSnow = { value: sets.snow.normal };
    shader.uniforms.uRoughSand = { value: sets.sand.roughness };
    shader.uniforms.uRoughGrass = { value: sets.grass.roughness };
    shader.uniforms.uRoughStone = { value: sets.stone.roughness };
    shader.uniforms.uRoughSnow = { value: sets.snow.roughness };
    shader.uniforms.uAoSand = { value: sets.sand.ao };
    shader.uniforms.uAoGrass = { value: sets.grass.ao };
    shader.uniforms.uAoStone = { value: sets.stone.ao };
    shader.uniforms.uAoSnow = { value: sets.snow.ao };
    shader.uniforms.hexTilingUseContrastCorrectedBlending = { value: TERRAIN_HEX_TILING.useContrastCorrectedBlending };
    shader.uniforms.hexTilingPatchScale = { value: TERRAIN_HEX_TILING.patchScale };
    shader.uniforms.hexTilingLookupSkipThreshold = { value: TERRAIN_HEX_TILING.lookupSkipThreshold };
    shader.uniforms.hexTilingTextureSampleCoefficientExponent = { value: TERRAIN_HEX_TILING.textureSampleCoefficientExponent };
    shader.uniforms.terrainLayerWeightMin = { value: TERRAIN_HEX_TILING.layerWeightMin };

    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
attribute float heightNorm;
varying float vHeightNorm;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
vHeightNorm = heightNorm;`);

    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
uniform sampler2D uTexSand, uTexGrass, uTexStone, uTexSnow;
varying float vHeightNorm;
${TERRAIN_BLEND_GLSL}`)
      .replace('#include <map_fragment>', `#ifdef USE_MAP
diffuseColor *= getTerrainColor(vMapUv, vHeightNorm);
#endif`)
      .replace(
        'texture2D( normalMap, vNormalMapUv )',
        'vec4( getTerrainNormal( vNormalMapUv, vHeightNorm ), 1.0 )',
      )
      .replace(
        'texture2D( roughnessMap, vRoughnessMapUv )',
        'vec4( getTerrainRoughness( vMapUv, vHeightNorm ) )',
      )
      .replace(
        'texture2D( aoMap, vAoMapUv )',
        'vec4( getTerrainAO( vAoMapUv, vHeightNorm ) )',
      );
  };
  material.customProgramCacheKey = () => 'terrain-height-blend-hex-pbr-v4';
  material.needsUpdate = true;
}

// ---------- Terrain (PNG heightmap) ----------

async function loadTerrain() {
  loadingMgr.set('Heightmap', 'Loading');
  const heightPixels = await loadImagePixelData(TERRAIN_HEIGHTMAP_URL);
  loadingMgr.set('Heightmap', 'Complete');

  loadingMgr.set('Forest guide', 'Loading');
  const guidePixels = await loadImagePixelData(FOREST_SPAWN_GUIDE_URL);
  const forestGuide = buildForestSpawnGuide(guidePixels);
  loadingMgr.set('Forest guide', 'Complete');

  loadingMgr.set('Terrain', 'Loading', 'Building mesh…');
  const sampleSize = Math.min(heightPixels.width, heightPixels.height, 2048);
  const data = heightPixels.data;
  const srcW = heightPixels.width;
  const srcH = heightPixels.height;

  const segments = Math.min(sampleSize - 1, 511);
  const geometry = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, segments, segments);
  geometry.rotateX(-Math.PI / 2);

  const uv = geometry.attributes.uv;
  geometry.setAttribute('uv2', uv);
  const pos = geometry.attributes.position;
  let minH = Infinity, maxH = -Infinity;
  const heights = new Float32Array(pos.count);
  const decodeHeight = (r, g, b) => {
    // Grayscale PNG/JPG DEM: use luma. Packed 24-bit RGB elevation: full range.
    const maxDiff = Math.max(Math.abs(r - g), Math.abs(r - b), Math.abs(g - b));
    if (maxDiff <= 2) return r / 255;
    return (r * 65536 + g * 256 + b) / 16777215;
  };
  for (let i = 0; i < pos.count; i++) {
    const px = Math.min(Math.floor(uv.getX(i) * srcW), srcW - 1);
    const py = Math.min(Math.floor((1 - uv.getY(i)) * srcH), srcH - 1);
    const idx = (py * srcW + px) * 4;
    const h = decodeHeight(data[idx], data[idx + 1], data[idx + 2]);
    heights[i] = h;
    if (h < minH) minH = h;
    if (h > maxH) maxH = h;
  }
  const range = maxH - minH || 1;
  for (let i = 0; i < pos.count; i++) {
    pos.setY(i, ((heights[i] - minH) / range) * HEIGHT_SCALE);
  }
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();
  geometry.computeBoundingSphere();

  const heightNorm = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) {
    heightNorm[i] = (heights[i] - minH) / range;
  }
  geometry.setAttribute('heightNorm', new THREE.BufferAttribute(heightNorm, 1));

  loadingMgr.set('Terrain textures', 'Loading');
  const textureSets = await loadTerrainTextureSets();
  loadingMgr.set('Terrain textures', 'Complete');

  loadingMgr.set('Terrain', 'Loading', 'Materials & collision…');
  const material = new THREE.MeshStandardMaterial({
    roughness: 0.85, metalness: 0.05, side: THREE.DoubleSide,
    polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4,
  });
  applyTerrainTextureBlending(material, textureSets);

  const mesh = new THREE.Mesh(geometry, material);
  terrainMesh = mesh;
  mesh.receiveShadow = true;
  mesh.castShadow = false;
  mesh.raycast = acceleratedRaycast;
  geometry.computeBoundsTree = computeBoundsTree;
  geometry.disposeBoundsTree = disposeBoundsTree;
  geometry.computeBoundsTree();
  const box = new THREE.Box3().setFromObject(mesh);
  const center = box.getCenter(new THREE.Vector3());
  mesh.position.x -= center.x;
  mesh.position.z -= center.z;
  mesh.position.y -= box.min.y;

  const waterMat = new THREE.MeshPhysicalMaterial({
    color: 0x3a7bd5, transparent: true, opacity: 0.4,
    roughness: 0.1, metalness: 0.05, side: THREE.DoubleSide,
  });
  const waterMesh = new THREE.Mesh(new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE), waterMat);
  waterMesh.rotation.x = -Math.PI / 2;
  waterMesh.position.y = HEIGHT_SCALE * TERRAIN_WATER_HEIGHT_NORM;
  waterMesh.renderOrder = 1;
  waterMesh.raycast = () => {};

  const group = new THREE.Group();
  group.add(mesh);
  group.add(waterMesh);
  scene.add(group);
  terrainGroup = group;

  terrainEntry = {
    group,
    mesh,
    waterMesh,
    forestGuide,
    _gridSegments: segments,
  };
  loadingMgr.set('Terrain', 'Complete');
}

// ---------- Character loading ----------

async function loadCharacter() {
  loadingMgr.set('Character', 'Loading');
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const { DRACOLoader } = await import('three/addons/loaders/DRACOLoader.js');
  const draco = new DRACOLoader();
  draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/libs/draco/gltf/');
  const loader = new GLTFLoader();
  loader.setDRACOLoader(draco);

  const gltf = await new Promise((r, j) => loader.load('./cac-1783902065521.glb', r, undefined, j));
  const root = gltf.scene;
  root.traverse((child) => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });

  const group = new THREE.Group();
  group.add(root);
  const { height } = centerModel(root);
  scene.add(group);

  const clips = gltf.animations.filter((c) => c.name !== EXCLUDED_CLIP);
  const mixer = new THREE.AnimationMixer(root);
  const byName = Object.fromEntries(clips.map((c) => [c.name, c]));

  // Height-based clip config matching test-engine-index
  const CLIPS = { idle: 'InjuredIdle', walk: 'CrouchedWalking', jump: 'Jump', roll: 'SprintingForwardRoll' };
  for (const [key, name] of Object.entries(CLIPS)) {
    if (!byName[name]) {
      const available = clips.map((c) => c.name).join(', ') || '(none)';
      throw new Error(`Missing animation clip "${name}" for ${key}. Available: ${available}`);
    }
  }
  const actions = {
    idle: mixer.clipAction(byName[CLIPS.idle]),
    walk: mixer.clipAction(inPlaceClip(byName[CLIPS.walk])),
    roll: mixer.clipAction(inPlaceClip(byName[CLIPS.roll])),
    jump: mixer.clipAction(byName[CLIPS.jump]),
  };
  for (const name of ['jump', 'roll']) {
    actions[name].setLoop(THREE.LoopOnce, 1);
    actions[name].clampWhenFinished = true;
  }

  mixer.addEventListener('finished', () => {
    character.oneShot = null;
    if (!character.airborne) setGameplayState(isMoving() ? 'walk' : 'idle');
  });

  character = {
    group, mixer, actions, height, state: 'idle', oneShot: null, currentAction: null,
    rollDir: new THREE.Vector3(), vy: 0, airborne: false,
  };
  setGameplayState('idle');

  const spawn = terrainForestSystem?.spawnTree ?? findForestSpawn(terrainEntry, FOREST_SEED);
  if (spawn) {
    group.position.set(spawn.x, spawn.y + Math.max(0.05, height * 0.02), spawn.z);
  } else {
    const h = sampleTerrainHeight(group.position.x, group.position.z);
    if (h !== null) group.position.y = h + Math.max(0.05, height * 0.02);
  }
  frameCameraChar();
  loadingMgr.set('Character', 'Complete');
}

// ---------- Init ----------

async function init() {
  loadingMgr.init(LOAD_STEPS);
  try {
    await loadTerrain();
    await buildTerrainForest();
    await loadCharacter();
    loadingMgr.hide();
  } catch (err) {
    console.error(err);
    loadingMgr.fail(err);
  }
}
init();

// ---------- Render loop ----------

function loop() {
  requestAnimationFrame(loop);
  const delta = Math.min(clock.getDelta(), 0.05);
  skyAnimTime += delta * SKY_ANIM_SPEED;
  skyVisUniforms.time.value = skyAnimTime;
  syncSkyToCamera();
  if (character) {
    character.mixer.update(delta);
    updateGameplay(delta);
    if (!updateVertical(delta)) snapToGround();
    followCamera(delta);
    updateSunShadow();
  }
  controls.update();
  updateCameraCollision();
  renderer.render(scene, camera);
}
loop();
</script>
