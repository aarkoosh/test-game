const waterState = {
  opacity: WATER_DEFAULTS.opacity,
  waveHeight: WATER_DEFAULTS.waveHeight,
  waveScale: WATER_DEFAULTS.waveScale,
  foamStrength: WATER_DEFAULTS.foamStrength,
  sssStrength: WATER_DEFAULTS.sssStrength,
  reflection: WATER_DEFAULTS.reflection,
  specular: WATER_DEFAULTS.specular,
  roughness: WATER_DEFAULTS.roughness,
  absorption: WATER_DEFAULTS.absorption,
  distortion: WATER_DEFAULTS.distortion,
  deepColor: new THREE.Color(WATER_DEFAULTS.deepColor),
  shallowColor: new THREE.Color(WATER_DEFAULTS.shallowColor),
  foamColor: new THREE.Color(WATER_DEFAULTS.foamColor),
};

const waterReflect = {
  target: null,
  camera: new THREE.PerspectiveCamera(),
  textureMatrix: new THREE.Matrix4(),
  clipPlane: new THREE.Plane(),
  _mirrorPos: new THREE.Vector3(),
  _normal: new THREE.Vector3(),
  _view: new THREE.Vector3(),
  _target: new THREE.Vector3(),
  _q: new THREE.Vector4(),
  _lookAt: new THREE.Vector3(0, 0, -1),
  _rotation: new THREE.Matrix4(),
  _clipVector: new THREE.Vector4(),
  _camWorld: new THREE.Vector3(),
};

function ensureWaterReflectTarget() {
  if (waterReflect.target) return waterReflect.target;
  waterReflect.target = new THREE.WebGLRenderTarget(WATER_REFLECT_SIZE, WATER_REFLECT_SIZE, {
    type: THREE.HalfFloatType,
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
  });
  return waterReflect.target;
}

function setForestReflectionVisible(visible) {
  const system = terrainForestSystem;
  if (!system?.builtChunks) return;
  for (const chunk of system.builtChunks.values()) {
    if (chunk.group) chunk.group.visible = visible;
  }
}

function renderWaterReflection(waterMesh, renderer, scene, camera) {
  const rt = ensureWaterReflectTarget();
  const mirrorCamera = waterReflect.camera;
  const textureMatrix = waterReflect.textureMatrix;
  const waterY = getWaterHeightY();

  waterReflect._camWorld.setFromMatrixPosition(camera.matrixWorld);
  waterReflect._mirrorPos.set(waterReflect._camWorld.x, waterY, waterReflect._camWorld.z);

  waterReflect._normal.set(0, 1, 0);
  waterReflect._view.subVectors(waterReflect._mirrorPos, waterReflect._camWorld);
  if (waterReflect._view.dot(waterReflect._normal) > 0) {
    if (waterMesh.material?.uniforms) waterMesh.material.uniforms.uHasMirror.value = 0;
    return;
  }

  waterReflect._view.reflect(waterReflect._normal).negate().add(waterReflect._mirrorPos);

  waterReflect._rotation.extractRotation(camera.matrixWorld);
  waterReflect._lookAt.set(0, 0, -1).applyMatrix4(waterReflect._rotation).add(waterReflect._camWorld);
  waterReflect._target.subVectors(waterReflect._mirrorPos, waterReflect._lookAt).reflect(waterReflect._normal).negate().add(waterReflect._mirrorPos);

  mirrorCamera.position.copy(waterReflect._view);
  mirrorCamera.up.set(0, 1, 0);
  mirrorCamera.lookAt(waterReflect._target);
  mirrorCamera.far = camera.far;
  mirrorCamera.near = Math.max(0.5, camera.near);
  mirrorCamera.fov = camera.fov;
  mirrorCamera.aspect = camera.aspect;
  mirrorCamera.updateProjectionMatrix();
  mirrorCamera.updateMatrixWorld();

  textureMatrix.set(
    0.5, 0.0, 0.0, 0.5,
    0.0, 0.5, 0.0, 0.5,
    0.0, 0.0, 0.5, 0.5,
    0.0, 0.0, 0.0, 1.0,
  );
  textureMatrix.multiply(mirrorCamera.projectionMatrix);
  textureMatrix.multiply(mirrorCamera.matrixWorldInverse);

  waterReflect.clipPlane.setFromNormalAndCoplanarPoint(waterReflect._normal, waterReflect._mirrorPos);
  waterReflect.clipPlane.applyMatrix4(mirrorCamera.matrixWorldInverse);
  waterReflect._clipVector.set(
    waterReflect.clipPlane.normal.x,
    waterReflect.clipPlane.normal.y,
    waterReflect.clipPlane.normal.z,
    waterReflect.clipPlane.constant,
  );

  const projectionMatrix = mirrorCamera.projectionMatrix;
  waterReflect._q.x = (Math.sign(waterReflect._clipVector.x) + projectionMatrix.elements[8]) / projectionMatrix.elements[0];
  waterReflect._q.y = (Math.sign(waterReflect._clipVector.y) + projectionMatrix.elements[9]) / projectionMatrix.elements[5];
  waterReflect._q.z = -1;
  waterReflect._q.w = (1 + projectionMatrix.elements[10]) / projectionMatrix.elements[14];
  waterReflect._clipVector.multiplyScalar(2 / waterReflect._clipVector.dot(waterReflect._q));
  projectionMatrix.elements[2] = waterReflect._clipVector.x;
  projectionMatrix.elements[6] = waterReflect._clipVector.y;
  projectionMatrix.elements[10] = waterReflect._clipVector.z + 1;
  projectionMatrix.elements[14] = waterReflect._clipVector.w;

  const prevTarget = renderer.getRenderTarget();
  const prevShadow = renderer.shadowMap.autoUpdate;
  const prevXr = renderer.xr.enabled;
  const prevClear = renderer.autoClear;
  const charVisible = character?.group ? character.group.visible : true;
  waterMesh.visible = false;
  if (character?.group) character.group.visible = false;
  setForestReflectionVisible(false);
  renderer.xr.enabled = false;
  renderer.shadowMap.autoUpdate = false;
  renderer.autoClear = true;
  renderer.setRenderTarget(rt);
  renderer.state.buffers.depth.setMask(true);
  renderer.clear();
  renderer.render(scene, mirrorCamera);
  setForestReflectionVisible(true);
  if (character?.group) character.group.visible = charVisible;
  waterMesh.visible = true;
  renderer.xr.enabled = prevXr;
  renderer.shadowMap.autoUpdate = prevShadow;
  renderer.autoClear = prevClear;
  renderer.setRenderTarget(prevTarget);

  const material = waterMesh.material;
  if (material?.uniforms) {
    material.uniforms.uMirrorMap.value = rt.texture;
    material.uniforms.uTextureMatrix.value.copy(textureMatrix);
    material.uniforms.uHasMirror.value = 1;
  }
}

function createOceanWaterMaterial() {
  const material = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uDeepColor: { value: waterState.deepColor.clone() },
      uShallowColor: { value: waterState.shallowColor.clone() },
      uFoamColor: { value: waterState.foamColor.clone() },
      uOpacity: { value: waterState.opacity },
      uWaveHeight: { value: 40 },
      uWaveScale: { value: 1 },
      uFoamStrength: { value: waterState.foamStrength },
      uSssStrength: { value: waterState.sssStrength },
      uReflection: { value: waterState.reflection },
      uSpecular: { value: waterState.specular },
      uRoughness: { value: waterState.roughness },
      uSunDirection: { value: new THREE.Vector3(0, 1, 0) },
      uSunColor: { value: new THREE.Color(0xfff1d6) },
      uSkyTurbidity: { value: 10 },
      uSkyRayleigh: { value: 1 },
      uMirrorMap: { value: null },
      uTextureMatrix: { value: new THREE.Matrix4() },
      uHasMirror: { value: 0 },
      uDistortion: { value: 0.35 },
      uAbsorption: { value: 0.55 },
    },
    vertexShader: `
      uniform float uTime;
      uniform float uWaveHeight;
      uniform float uWaveScale;
      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;
      varying vec4 vMirrorCoord;
      varying float vFoam;
      varying float vWaveElev;
      varying vec2 vLocalUv;
      uniform mat4 uTextureMatrix;
      #include <common>
      #include <logdepthbuf_pars_vertex>

      void gerstnerWave(
        vec2 direction, float wavelength, float amplitude, float steepness, float speedMul,
        vec3 p, float time,
        inout vec3 displacement, inout vec3 tangent, inout vec3 binormal, inout float jacobian
      ) {
        float k = PI2 / max(wavelength, 0.001);
        float c = sqrt(9.81 / k) * speedMul;
        vec2 d = normalize(direction);
        float f = k * (dot(d, p.xz) - c * time);
        float a = amplitude;
        float Q = steepness;
        float sinF = sin(f);
        float cosF = cos(f);
        float Qa = Q * a;
        displacement.x += Qa * d.x * cosF;
        displacement.y += a * sinF;
        displacement.z += Qa * d.y * cosF;
        float Qak = Q * a * k;
        tangent += vec3(-d.x * d.x * Qak * sinF, d.x * a * k * cosF, -d.x * d.y * Qak * sinF);
        binormal += vec3(-d.x * d.y * Qak * sinF, d.y * a * k * cosF, -d.y * d.y * Qak * sinF);
        jacobian += Qak * cosF;
      }

      void main() {
        vLocalUv = uv;
        vec3 world = (modelMatrix * vec4(position, 1.0)).xyz;
        float scale = max(uWaveScale, 0.2);
        float h = uWaveHeight;
        float t = uTime;
        vec3 displacement = vec3(0.0);
        vec3 tangent = vec3(1.0, 0.0, 0.0);
        vec3 binormal = vec3(0.0, 0.0, 1.0);
        float jacobian = 0.0;
        gerstnerWave(vec2(1.00, 0.20), 1800.0 * scale, h * 0.42, 0.70, 1.00, world, t, displacement, tangent, binormal, jacobian);
        gerstnerWave(vec2(0.65, 0.76), 980.0 * scale, h * 0.28, 0.65, 1.07, world, t, displacement, tangent, binormal, jacobian);
        gerstnerWave(vec2(-0.82, 0.48), 540.0 * scale, h * 0.18, 0.60, 1.15, world, t, displacement, tangent, binormal, jacobian);
        gerstnerWave(vec2(0.25, -0.97), 260.0 * scale, h * 0.12, 0.55, 1.28, world, t, displacement, tangent, binormal, jacobian);
        gerstnerWave(vec2(-0.94, -0.25), 130.0 * scale, h * 0.07, 0.50, 1.42, world, t, displacement, tangent, binormal, jacobian);
        gerstnerWave(vec2(0.48, 0.88), 68.0 * scale, h * 0.045, 0.45, 1.60, world, t, displacement, tangent, binormal, jacobian);
        gerstnerWave(vec2(-0.38, 0.92), 34.0 * scale, h * 0.028, 0.40, 1.82, world, t, displacement, tangent, binormal, jacobian);
        gerstnerWave(vec2(0.9, -0.4), 17.0 * scale, h * 0.016, 0.35, 2.10, world, t, displacement, tangent, binormal, jacobian);
        world += displacement;
        vec3 normal = normalize(cross(binormal, tangent));
        vWorldPos = world;
        vWorldNormal = normal;
        vWaveElev = displacement.y;
        vFoam = saturate(max(0.0, jacobian) * 0.85);
        vMirrorCoord = uTextureMatrix * vec4(world, 1.0);
        gl_Position = projectionMatrix * viewMatrix * vec4(world, 1.0);
        #include <logdepthbuf_vertex>
      }
    `,
    fragmentShader: `
      uniform vec3 uDeepColor;
      uniform vec3 uShallowColor;
      uniform vec3 uFoamColor;
      uniform float uOpacity;
      uniform float uFoamStrength;
      uniform float uSssStrength;
      uniform float uReflection;
      uniform float uSpecular;
      uniform float uRoughness;
      uniform vec3 uSunDirection;
      uniform vec3 uSunColor;
      uniform float uSkyTurbidity;
      uniform float uSkyRayleigh;
      uniform sampler2D uMirrorMap;
      uniform float uHasMirror;
      uniform float uDistortion;
      uniform float uAbsorption;
      uniform float uTime;
      uniform float uWaveScale;
      uniform float uWaveHeight;
      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;
      varying vec4 vMirrorCoord;
      varying float vFoam;
      varying float vWaveElev;
      varying vec2 vLocalUv;
      #include <common>
      #include <logdepthbuf_pars_fragment>

      float hash12(vec2 p) {
        vec3 p3 = fract(vec3(p.xyx) * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }

      float noise2(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        float a = hash12(i);
        float b = hash12(i + vec2(1.0, 0.0));
        float c = hash12(i + vec2(0.0, 1.0));
        float d = hash12(i + vec2(1.0, 1.0));
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
        for (int i = 0; i < 5; i++) {
          v += a * noise2(p);
          p = m * p;
          a *= 0.5;
        }
        return v;
      }

      vec3 detailNormal(vec3 baseN, vec3 worldPos) {
        float scale = 0.055 / max(uWaveScale, 0.25);
        vec2 uv = worldPos.xz * scale;
        float t = uTime * 0.28;
        float e = 0.45;
        float h = fbm(uv + vec2(t * 0.13, -t * 0.09));
        float hx = fbm(uv + vec2(e, 0.0) + vec2(t * 0.13, -t * 0.09)) - h;
        float hz = fbm(uv + vec2(0.0, e) + vec2(t * 0.13, -t * 0.09)) - h;
        float chop = 0.7 + fbm(uv * 3.1 - t * 0.2) * 0.45;
        vec3 n = normalize(vec3(-hx * chop, 1.0, -hz * chop));
        vec3 tng = normalize(cross(baseN, vec3(0.0, 0.0, 1.0)));
        if (dot(tng, tng) < 0.001) tng = normalize(cross(baseN, vec3(1.0, 0.0, 0.0)));
        vec3 btg = cross(baseN, tng);
        return normalize(tng * n.x + baseN * n.y + btg * n.z);
      }

      vec3 sampleSky(vec3 R) {
        vec3 sunDir = normalize(uSunDirection);
        vec3 rd = normalize(R);
        float mu = max(dot(rd, sunDir), 0.0);
        float elev = sunDir.y;
        float warm = smoothstep(0.28, -0.08, elev);
        float night = smoothstep(0.05, -0.15, elev);
        vec3 zenith = mix(mix(vec3(0.08, 0.24, 0.66), vec3(0.12, 0.14, 0.28), warm), vec3(0.01, 0.02, 0.05), night);
        vec3 horizon = mix(mix(vec3(0.52, 0.70, 0.92), vec3(0.95, 0.42, 0.16), warm), vec3(0.04, 0.05, 0.08), night);
        vec3 sky = mix(horizon, zenith, pow(clamp(rd.y, 0.0, 1.0), 0.45));
        sky = mix(vec3(0.18, 0.22, 0.26), sky, smoothstep(-0.12, 0.06, rd.y));
        sky += uSunColor * pow(mu, mix(220.0, 18.0, warm)) * (1.5 + uSkyTurbidity * 0.05);
        sky += uSunColor * pow(mu, 5.0) * uSkyRayleigh * 0.1;
        sky += uSunColor * pow(mu, 1200.0) * 5.0;
        return sky;
      }

      float schlickFresnel(float cosTheta) {
        float f0 = 0.02;
        return f0 + (1.0 - f0) * pow(1.0 - saturate(cosTheta), 5.0);
      }

      float ggxSpec(vec3 N, vec3 V, vec3 L, float roughness) {
        vec3 H = normalize(V + L);
        float nh = max(dot(N, H), 0.0);
        float a = max(roughness * roughness, 0.002);
        float a2 = a * a;
        float d = (nh * nh) * (a2 - 1.0) + 1.0;
        return a2 / max(PI * d * d, 1e-4);
      }

      void main() {
        #include <logdepthbuf_fragment>
        vec3 baseN = normalize(vWorldNormal);
        if (!gl_FrontFacing) baseN = -baseN;
        vec3 N = normalize(mix(baseN, detailNormal(baseN, vWorldPos), 0.35));
        vec3 V = normalize(cameraPosition - vWorldPos);
        vec3 L = normalize(uSunDirection);
        float ndotv = max(dot(N, V), 0.0);
        float fresnel = schlickFresnel(ndotv);
        fresnel = mix(fresnel, 1.0, saturate(uRoughness * 0.2));

        float path = 1.0 / max(ndotv, 0.08);
        float heightNorm = saturate(vWaveElev / max(uWaveHeight * 0.65, 1.0) * 0.5 + 0.5);
        vec3 scatterCol = mix(uDeepColor, uShallowColor, heightNorm);
        vec3 absorb = exp(-mix(vec3(0.35, 0.08, 0.05), vec3(0.12, 0.04, 0.03), heightNorm) * path * uAbsorption * 4.0);
        vec3 waterBody = scatterCol * absorb;

        float sss = pow(max(dot(V, -L), 0.0), 2.2);
        sss *= saturate(0.2 + heightNorm);
        sss *= 0.55 + 0.45 * pow(1.0 - ndotv, 1.5);
        waterBody += uShallowColor * sss * uSssStrength * 1.6;
        waterBody += vec3(0.02, 0.22, 0.18) * pow(1.0 - ndotv, 3.0) * uSssStrength * 0.4;

        vec3 reflectN = normalize(mix(vec3(0.0, 1.0, 0.0), baseN, 0.22));
        reflectN = normalize(mix(reflectN, N, 0.12));
        vec3 R = reflect(-V, reflectN);
        vec3 sky = sampleSky(R);

        float dist = length(cameraPosition - vWorldPos);
        float distortAmt = 0.0025 * uDistortion;
        distortAmt = min(distortAmt, 0.008);
        vec2 distort = reflectN.xz * distortAmt;
        vec3 mirrorCol = sky;
        if (uHasMirror > 0.5) {
          vec2 muv = vMirrorCoord.xy / max(vMirrorCoord.w, 1e-4);
          muv += distort;
          muv.x = 1.0 - muv.x;
          float edge = saturate(min(min(muv.x, 1.0 - muv.x), min(muv.y, 1.0 - muv.y)) * 12.0);
          muv = clamp(muv, 0.001, 0.999);
          vec3 mirrored = texture2D(uMirrorMap, muv).rgb;
          mirrorCol = mix(sky, mirrored, edge * 0.95);
        }
        mirrorCol = mix(mirrorCol, sky, saturate(dist / 280000.0) * 0.35);

        float rough = clamp(uRoughness, 0.02, 0.6);
        float spec = ggxSpec(N, V, L, rough) * uSpecular * 0.55;
        float glint = pow(max(dot(normalize(reflect(-V, N)), L), 0.0), mix(900.0, 40.0, rough)) * uSpecular * 2.2;
        vec3 specular = uSunColor * (spec + glint) * (0.35 + 0.65 * fresnel);

        float foam = vFoam * uFoamStrength;
        foam = max(foam, saturate((vWaveElev / max(uWaveHeight, 1.0)) - 0.55) * 0.45 * uFoamStrength);
        float wind = fbm(vWorldPos.xz * (0.06 / max(uWaveScale, 0.3)) + vec2(uTime * 0.07, -uTime * 0.04));
        float trails = fbm(vWorldPos.xz * (0.12 / max(uWaveScale, 0.3)) - vec2(uTime * 0.11, uTime * 0.05));
        foam *= smoothstep(0.2, 0.72, wind * 0.65 + trails * 0.35);
        foam = saturate(foam);
        float peakFoam = saturate(foam * 1.4 - 0.25);

        vec3 albedo = mix(waterBody, uFoamColor, foam * 0.85);
        albedo = mix(albedo, vec3(1.0), peakFoam * 0.35);
        vec3 color = mix(albedo, mirrorCol, saturate(fresnel * uReflection));
        color += specular * (1.0 - foam * 0.8);
        color += uSunColor * max(dot(N, L), 0.0) * 0.06 * (1.0 - foam);
        color += sky * pow(1.0 - ndotv, 3.0) * 0.08 * uReflection;

        float alpha = mix(uOpacity * 0.78, min(1.0, uOpacity + 0.06), fresnel);
        alpha = mix(alpha, min(1.0, alpha + 0.22), foam);
        float edgeDist = max(abs(vLocalUv.x - 0.5), abs(vLocalUv.y - 0.5)) * 2.0;
        alpha *= 1.0 - smoothstep(0.92, 1.0, edgeDist);
        gl_FragColor = vec4(color, alpha);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `,
    transparent: true,
    depthWrite: true,
    side: THREE.DoubleSide,
  });
  return material;
}

function syncOceanWaterMaterial(material) {
  if (!material?.uniforms) return;
  const u = material.uniforms;
  u.uDeepColor.value.copy(waterState.deepColor);
  u.uShallowColor.value.copy(waterState.shallowColor);
  u.uFoamColor.value.copy(waterState.foamColor);
  u.uOpacity.value = waterState.opacity;
  u.uWaveHeight.value = Math.max(6, waterState.waveHeight * 72);
  u.uWaveScale.value = waterState.waveScale;
  u.uFoamStrength.value = waterState.foamStrength;
  u.uSssStrength.value = waterState.sssStrength;
  u.uReflection.value = waterState.reflection;
  u.uSpecular.value = waterState.specular;
  u.uRoughness.value = waterState.roughness;
  if (u.uAbsorption) u.uAbsorption.value = waterState.absorption;
  if (u.uDistortion) u.uDistortion.value = waterState.distortion;
  u.uSunDirection.value.copy(skySunDir);
  u.uSunColor.value.copy(sun.color).multiplyScalar(Math.max(0.75, sun.intensity * 0.55));
  u.uSkyTurbidity.value = sunParams.turbidity;
  u.uSkyRayleigh.value = sunParams.rayleigh;
}

function getWaterHeightY() {
  return HEIGHT_SCALE * terrainWaterHeightNorm * terrainReliefScale + terrainHeightShift;
}

function syncWaterHeightToTerrain() {
  if (!terrainEntry?.waterMesh) return;
  terrainEntry.waterMesh.position.y = getWaterHeightY();
}

const _waterLook = new THREE.Vector3();
const _waterCenter = new THREE.Vector3();

function updateOceanWater(delta) {
  const waterMesh = terrainEntry?.waterMesh;
  if (!waterMesh) return;
  const material = waterMesh.material;
  if (material?.uniforms?.uTime) material.uniforms.uTime.value += delta;
  syncOceanWaterMaterial(material);

  const y = getWaterHeightY();
  const heightAbove = Math.max(1, Math.abs(camera.position.y - y));
  const orbit = Math.max(50, camera.position.distanceTo(controls.target));
  const far = Math.max(camera.far, TERRAIN_SIZE);
  const fovRad = THREE.MathUtils.degToRad(Math.max(20, camera.fov));
  const horizonFromHeight = heightAbove / Math.max(0.02, Math.tan(fovRad * 0.5));
  const size = Math.min(
    TERRAIN_SIZE * 1.45,
    Math.max(
      TERRAIN_SIZE * 1.15,
      far * 1.25,
      horizonFromHeight * 2.4,
      orbit * 12 + heightAbove * 18,
      80000,
    ),
  );

  let snapX = 0;
  let snapZ = 0;
  if (size < TERRAIN_SIZE * 1.14) {
    camera.getWorldDirection(_waterLook);
    _waterCenter.set(camera.position.x, y, camera.position.z);
    if (Math.abs(_waterLook.y) > 0.002) {
      const t = (y - camera.position.y) / _waterLook.y;
      if (t > 0 && t < far * 1.5) {
        _waterCenter.x = camera.position.x + _waterLook.x * t;
        _waterCenter.z = camera.position.z + _waterLook.z * t;
      }
    }
    _waterCenter.x = THREE.MathUtils.lerp(camera.position.x, _waterCenter.x, 0.65);
    _waterCenter.z = THREE.MathUtils.lerp(camera.position.z, _waterCenter.z, 0.65);
    const cell = size / WATER_SEGMENTS;
    snapX = Math.round(_waterCenter.x / cell) * cell;
    snapZ = Math.round(_waterCenter.z / cell) * cell;
  }

  waterMesh.scale.set(size, size, 1);
  waterMesh.position.x = snapX;
  waterMesh.position.z = snapZ;
  waterMesh.position.y = y;
  waterMesh.frustumCulled = false;
  waterMesh.updateMatrixWorld(true);

  if (!waterMesh.userData._reflectBound) {
    waterMesh.userData._reflectBound = true;
    waterMesh.onBeforeRender = (renderer, scene, cam) => {
      if (waterMesh.userData._reflecting) return;
      waterMesh.userData._reflecting = true;
      try {
        renderWaterReflection(waterMesh, renderer, scene, cam);
      } finally {
        waterMesh.userData._reflecting = false;
      }
    };
  }
}

function getTerrainProcNoise() {
  if (!terrainProcNoise) terrainProcNoise = new PerlinNoise(terrainNoiseSeed);
  return terrainProcNoise;
}

function tectonicHeightMod(x, z) {
  if (terrainCrustFactor === 0 && terrainTectonicFactor === 0) return 0;
  const pn = getTerrainProcNoise();
  const crustScale = terrainHillParams.spacing * 6;
  const crust = pn.fbm(x / crustScale, z / crustScale, 3, 2.5, 0.5);
  const tectonic = 0.2 / (Math.abs(crust) + 0.1) - 0.95;
  return (crust * terrainCrustFactor + tectonic * terrainTectonicFactor) * HEIGHT_SCALE * 0.08;
}

function noiseHeight(x, z) {
  const pn = getTerrainProcNoise();
  let h;
  if (terrainMountainBorderMode) {
    const half = TERRAIN_SIZE / 2;
    const dist = Math.sqrt(x * x + z * z) / half;
    const mbRadiusNorm = terrainMbRadius / 100;
    const mbWidthNorm = terrainMbWidth / 100;
    const irreg = terrainMbIrregularity * 0.01;
    const noiseOff = irreg > 0
      ? pn.fbm(x * 0.005, z * 0.005, terrainNoiseOctaves, terrainNoiseLacunarity, terrainNoisePersistence) * irreg
      : 0;
    const ringDist = (dist + noiseOff - mbRadiusNorm) / mbWidthNorm;
    const ringWeight = Math.exp(-ringDist * ringDist);
    const mtnNoise = pn.fbm(x * 0.012, z * 0.012, terrainNoiseOctaves, terrainNoiseLacunarity, terrainNoisePersistence);
    const detail = terrainHillParams.detail !== 0 ? pn.noise(x * 0.03, z * 0.03) * 10 * terrainHillParams.detail : 0;
    const dune = terrainHillParams.dunes !== 0 ? pn.noise(x * 0.006, z * 0.006) * 20 * terrainHillParams.dunes : 0;
    h = (ringWeight * (0.5 + mtnNoise * 0.5) * (terrainMbHeight / 100) * HEIGHT_SCALE * 0.4 + detail + dune)
      * terrainHillParams.height * terrainHillParams.rolling;
  } else {
    const baseScale = terrainHillParams.spacing * 3 * (TERRAIN_SIZE / 1000);
    const sx = baseScale / Math.max(0.01, terrainHillParams.freqX);
    const sz = baseScale / Math.max(0.01, terrainHillParams.freqZ);
    let nx = x / sx;
    let nz = z / sz;
    if (terrainWarpStrength > 0) {
      const w = terrainWarpStrength / baseScale;
      nx += pn.fbm(x * 0.005 + 100, z * 0.005, 2, 2, 0.5) * w;
      nz += pn.fbm(x * 0.005 + 200, z * 0.005 + 100, 2, 2, 0.5) * w;
    }
    const n = pn.fbm(nx, nz, terrainNoiseOctaves, terrainNoiseLacunarity, terrainNoisePersistence);
    const detailNoise = terrainHillParams.detail !== 0 ? pn.noise(x * 0.02, z * 0.02) * 0.2 * terrainHillParams.detail : 0;
    const duneNoise = terrainHillParams.dunes !== 0 ? pn.noise(x * 0.004, z * 0.004) * 0.4 * terrainHillParams.dunes : 0;
    h = (n + detailNoise + duneNoise) * terrainHillParams.height * HEIGHT_SCALE * terrainHillParams.rolling;
  }
  if (terrainHillParams.displacement && terrainHillParams.height > 0) {
    h += pn.noise(x * 0.08, z * 0.08) * terrainHillParams.displacement * HEIGHT_SCALE * 0.05;
  }
  return h + tectonicHeightMod(x, z);
}

function writeTerrainHeightNormAttr(heights) {
  let minH = Infinity;
  let maxH = -Infinity;
  for (let i = 0; i < heights.length; i++) {
    if (heights[i] < minH) minH = heights[i];
    if (heights[i] > maxH) maxH = heights[i];
  }
  const range = maxH - minH || 1;
  const attr = terrainMesh.geometry.attributes.heightNorm;
  for (let i = 0; i < heights.length; i++) {
    attr.array[i] = (heights[i] - minH) / range;
  }
  attr.needsUpdate = true;
}

function scheduleForestRestick() {
  if (forestRestickThrottleId) clearTimeout(forestRestickThrottleId);
  forestRestickThrottleId = setTimeout(() => {
    forestRestickThrottleId = 0;
    restickForestToTerrain();
  }, 350);
}

function flushForestRestick() {
  if (forestRestickThrottleId) {
    clearTimeout(forestRestickThrottleId);
    forestRestickThrottleId = 0;
  }
  restickForestToTerrain();
}

function restickForestToTerrain() {
  if (!terrainForestSystem || !terrainEntry) return;
  for (const trees of terrainForestSystem.chunkBins.values()) {
    for (let i = 0; i < trees.length; i += 6) {
      const sample = sampleTerrainSurface(terrainEntry, trees[i], trees[i + 2]);
      if (sample) trees[i + 1] = sample.y;
    }
  }
  if (terrainForestSystem.spawnTree) {
    const s = sampleTerrainSurface(
      terrainEntry,
      terrainForestSystem.spawnTree.x,
      terrainForestSystem.spawnTree.z,
    );
    if (s) terrainForestSystem.spawnTree.y = s.y;
  }
  for (const chunk of terrainForestSystem.builtChunks.values()) {
    const trees = chunk.trees;
    const group = chunk.group;
    const parent = group.parent;
    disposeTerrainForestChunkGroup(group);
    group.removeFromParent();
    const next = buildTerrainForestChunkGroup(trees, terrainForestSystem.templates);
    prepareMeshes(next);
    chunk.group = next;
    if (parent) parent.add(next);
  }
  terrainForestSystem.instancedMeshes = [];
  for (const chunk of terrainForestSystem.builtChunks.values()) {
    terrainForestSystem.instancedMeshes.push(...chunk.group.userData.instancedMeshes);
  }
}

function updateTerrainTextureScale(scale = terrainTextureScale) {
  terrainTextureScale = scale;
  if (!terrainTextureSetsPromise) return;
  terrainTextureSetsPromise.then((sets) => {
    const repeat = scale * (TERRAIN_SIZE / TERRAIN_TEXTURE_REFERENCE_SIZE);
    for (const key of ['sand', 'grass', 'stone', 'snow']) {
      const set = sets[key];
      if (!set) continue;
      set.color.repeat.set(repeat, repeat);
      set.normal.repeat.set(repeat, repeat);
      set.roughness.repeat.set(repeat, repeat);
      set.ao.repeat.set(repeat, repeat);
    }
  });
}

function updateTerrainFromProcedural() {
  if (!terrainEntry?.mesh?.geometry || !terrainEntry._normalizedHeights || !terrainEntry._basePositions) return;
  const mesh = terrainEntry.mesh;
  const pos = mesh.geometry.attributes.position;
  const nh = terrainEntry._normalizedHeights;
  const bp = terrainEntry._basePositions;
  const scale = terrainReliefScale * HEIGHT_SCALE;
  const heights = new Float32Array(pos.count);
  let minH = Infinity;
  let maxH = -Infinity;
  for (let i = 0; i < pos.count; i++) {
    const h = nh[i] * scale + noiseHeight(bp[i * 2], bp[i * 2 + 1]);
    heights[i] = h;
    if (h < minH) minH = h;
    if (h > maxH) maxH = h;
  }
  const range = maxH - minH || 1;
  if (terrainHeightRedistribution !== 1) {
    for (let i = 0; i < pos.count; i++) {
      const t = (heights[i] - minH) / range;
      heights[i] = minH + Math.pow(t, terrainHeightRedistribution) * range;
    }
  }
  if (terrainWaterBorder > 0) {
    const half = TERRAIN_SIZE / 2;
    const borderFrac = terrainWaterBorder / 100;
    const cornerR = Math.min(borderFrac * 0.6, 0.45);
    let borderMinH = Infinity;
    for (let i = 0; i < pos.count; i++) {
      if (heights[i] < borderMinH) borderMinH = heights[i];
    }
    for (let i = 0; i < pos.count; i++) {
      const dx = Math.abs(bp[i * 2]) / half;
      const dz = Math.abs(bp[i * 2 + 1]) / half;
      const flatDist = Math.min(Math.max(dx, dz), 1 - cornerR);
      const qx = Math.max(dx - (1 - cornerR), 0);
      const qz = Math.max(dz - (1 - cornerR), 0);
      const edgeDist = (flatDist + Math.hypot(qx, qz)) / (1 - cornerR + cornerR * Math.SQRT2);
      const t = Math.max(0, (edgeDist - (1 - borderFrac)) / borderFrac);
      heights[i] = heights[i] * (1 - t) + borderMinH * t;
    }
  }
  writeTerrainHeightNormAttr(heights);
  for (let i = 0; i < pos.count; i++) {
    pos.setY(i, heights[i]);
  }
  pos.needsUpdate = true;
  mesh.position.y = 0;
  mesh.geometry.computeVertexNormals();
  mesh.geometry.computeBoundingBox();
  mesh.geometry.computeBoundingSphere();
  if (mesh.geometry.boundsTree) mesh.geometry.disposeBoundsTree();
  mesh.geometry.computeBoundsTree();
  terrainHeightShift = 0;
  appliedTerrainReliefScale = terrainReliefScale;
  appliedTerrainHeightShift = 0;
  syncWaterHeightToTerrain();
  scheduleForestRestick();
  if (character && !mapEditorOpen) snapToGround();
}

function scheduleTerrainProceduralUpdate() {
  if (terrainProcUpdatePending) return;
  terrainProcUpdatePending = true;
  requestAnimationFrame(() => {
    terrainProcUpdatePending = false;
    updateTerrainFromProcedural();
  });
}

function applyTerrainVerticalEdit(newScale, newShift) {
  terrainReliefScale = newScale;
  terrainHeightShift = 0;
  updateTerrainFromProcedural();
}

function scheduleTerrainVerticalEdit(newScale) {
  terrainReliefScale = newScale;
  terrainHeightShift = 0;
  if (terrainVerticalThrottleId) return;
  terrainVerticalThrottleId = setTimeout(() => {
    terrainVerticalThrottleId = 0;
    scheduleTerrainProceduralUpdate();
  }, 80);
}

function syncVolCloudUniforms() {
  if (!volCloudMat) return;
  const u = volCloudMat.uniforms;
  u.uSunIntensity.value = VOL_CLOUDS.sunIntensity;
  u.uAmbientScale.value = VOL_CLOUDS.ambientScale;
  u.uCloudBaseY.value = VOL_CLOUDS.baseY;
  u.uCloudHeight.value = VOL_CLOUDS.height;
  u.uCoverage.value = VOL_CLOUDS.coverage;
  u.uDensityScale.value = VOL_CLOUDS.densityScale;
  u.uAbsorp.value = VOL_CLOUDS.absorp;
}

function frameCameraTerrainCenter() {
  const targetObj = terrainMesh || terrainGroup;
  const center = new THREE.Vector3();
  if (targetObj) {
    const box = new THREE.Box3().setFromObject(targetObj);
    box.getCenter(center);
  } else {
    center.set(0, HEIGHT_SCALE * 0.5 * terrainReliefScale, 0);
  }
  controls.target.copy(center);
  const dist = Math.max(TERRAIN_SIZE * 0.2, HEIGHT_SCALE * Math.max(terrainReliefScale, 0.5) * 1.2);
  camera.position.set(center.x, center.y + dist * 0.45, center.z + dist * 0.85);
  controls.enablePan = false;
  controls.enableRotate = true;
  controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: null };
  controls.minDistance = 1;
  controls.maxDistance = TERRAIN_SIZE * 0.6;
  controls.minPolarAngle = 0;
  controls.maxPolarAngle = Math.PI * 0.49;
  camera.near = Math.max(1, dist * 0.0001);
  camera.updateProjectionMatrix();
  syncSkyToCamera();
}

function setMapEditorOpen(open) {
  if (!character || mapEditorOpen === open) return;
  if (open && mapView) setMapView(false);
  mapEditorOpen = open;
  keys.KeyW = keys.KeyA = keys.KeyS = keys.KeyD = false;
  const panel = document.getElementById('map-editor');
  const skillBar = document.getElementById('skill-bar');
  if (panel) panel.classList.toggle('hidden', !open);
  if (skillBar) skillBar.classList.toggle('hidden', open);
  character.group.visible = !open;
  if (open) {
    frameCameraTerrainCenter();
  } else {
    if (terrainVerticalThrottleId) {
      clearTimeout(terrainVerticalThrottleId);
      terrainVerticalThrottleId = 0;
      updateTerrainFromProcedural();
    }
    flushForestRestick();
    frameCameraChar();
    snapToGround();
  }
}

function createEditorToggle(parent, label, checked, onChange) {
  const row = document.createElement('div');
  row.className = 'toggle-row';
  const lab = document.createElement('label');
  lab.textContent = label;
  const input = document.createElement('input');
  input.type = 'checkbox';
  input.checked = checked;
  input.addEventListener('change', () => onChange(input.checked));
  row.append(lab, input);
  parent.appendChild(row);
  return input;
}

function createEditorSlider(parent, label, min, max, step, value, format, onInput) {
  const row = document.createElement('div');
  row.className = 'slider-row';
  const lab = document.createElement('label');
  const name = document.createElement('span');
  name.textContent = label;
  const out = document.createElement('output');
  out.textContent = format(value);
  lab.append(name, out);
  const input = document.createElement('input');
  input.type = 'range';
  input.min = String(min);
  input.max = String(max);
  input.step = String(step);
  input.value = String(value);
  input.addEventListener('input', () => {
    const v = Number(input.value);
    out.textContent = format(v);
    onInput(v);
  });
  row.append(lab, input);
  parent.appendChild(row);
  return input;
}

function createEditorSection(parent, title) {
  const el = document.createElement('div');
  el.className = 'section-title';
  el.textContent = title;
  parent.appendChild(el);
  return el;
}

      setMapView(false);
      return;
    }
    if (!mapEditorOpen) buildMapEditorPanel();
    setMapEditorOpen(!mapEditorOpen);
    return;
  }
  if (mapEditorOpen) return;
  if (e.code === 'KeyM' && !e.repeat) { setMapView(!mapView); return; }
  if (mapView) return;
  if (e.code in keys) { keys[e.code] = true; return; }
  if (e.repeat) return;
  if (e.code === 'Space') { e.preventDefault(); triggerJump(); }
  else if (e.code === 'Digit1') { e.preventDefault(); triggerTeleport(); }
  else if (e.code === 'ControlLeft' || e.code === 'ControlRight') { e.preventDefault(); triggerRoll(); }
});

// ---------- Terrain textures ----------

const TERRAIN_TEXTURE_REFERENCE_SIZE = 8000;
const TERRAIN_TEXTURE_SCALE = 48;
const TERRAIN_TEXTURE_REPEAT = TERRAIN_TEXTURE_SCALE * (TERRAIN_SIZE / TERRAIN_TEXTURE_REFERENCE_SIZE);
const TERRAIN_HEX_TILING = {
  patchScale: 2,
  useContrastCorrectedBlending: false,
  lookupSkipThreshold: 0.08,
  textureSampleCoefficientExponent: 6,
  layerWeightMin: 0.02,
};
const terrainTextureLoader = new THREE.TextureLoader();

function configureTerrainTexture(tex, colorSpace) {
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(TERRAIN_TEXTURE_REPEAT, TERRAIN_TEXTURE_REPEAT);
  tex.colorSpace = colorSpace;
  tex.anisotropy = 8;
  return tex;
}

function loadTerrainTexture(url, colorSpace) {
  return new Promise((resolve, reject) => {
    terrainTextureLoader.load(
      url,
      (tex) => resolve(configureTerrainTexture(tex, colorSpace)),
      undefined,
      () => reject(new Error(`Failed to load texture: ${url}`)),
    );
  });
}

async function loadTerrainTextureSet(prefix) {
  const base = `./textures/${prefix}`;
  const [color, normal, roughness, ao] = await Promise.all([
    loadTerrainTexture(`${base}_Color.jpg`, THREE.SRGBColorSpace),
    loadTerrainTexture(`${base}_NormalGL.jpg`, THREE.NoColorSpace),
    loadTerrainTexture(`${base}_Roughness.jpg`, THREE.NoColorSpace),
    loadTerrainTexture(`${base}_AmbientOcclusion.jpg`, THREE.NoColorSpace),
  ]);
  return { color, normal, roughness, ao };
}

let terrainTextureSetsPromise = null;

function loadTerrainTextureSets() {
  if (!terrainTextureSetsPromise) {
    terrainTextureSetsPromise = Promise.all([
      loadTerrainTextureSet('Ground103_2K-JPG'),
      loadTerrainTextureSet('Ground037_2K-JPG'),
      loadTerrainTextureSet('Snow015_2K-JPG'),
      loadTerrainTextureSet('Snow014_2K-JPG'),
    ]).then(([sand, grass, stone, snow]) => ({ sand, grass, stone, snow }));
  }
  return terrainTextureSetsPromise;
}

const TERRAIN_BLEND_GLSL = `
#define rnd22(p) fract(sin((p) * mat2(127.1, 311.7, 269.5, 183.3)) * 43758.5453)
#define srgb2rgb(V) pow(max(V, 0.0), vec4(2.2))
#define rgb2srgb(V) pow(max(V, 0.0), vec4(1.0 / 2.2))

uniform bool hexTilingUseContrastCorrectedBlending;
uniform float hexTilingPatchScale;
uniform float hexTilingLookupSkipThreshold;
uniform float hexTilingTextureSampleCoefficientExponent;
uniform float terrainLayerWeightMin;
uniform sampler2D uNormSand, uNormGrass, uNormStone, uNormSnow;
uniform sampler2D uRoughSand, uRoughGrass, uRoughStone, uRoughSnow;
uniform sampler2D uAoSand, uAoGrass, uAoStone, uAoSnow;

float terrainHash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}
float terrainNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = terrainHash(i);
  float b = terrainHash(i + vec2(1.0, 0.0));
  float c = terrainHash(i + vec2(0.0, 1.0));
  float d = terrainHash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
vec4 hexTileSample(sampler2D samp, vec2 tileIndex, vec2 U, vec2 Gx, vec2 Gy, vec4 meanColor) {
  return srgb2rgb(textureGrad(samp, U / hexTilingPatchScale - rnd22(tileIndex), Gx, Gy))
    - meanColor * float(hexTilingUseContrastCorrectedBlending);
}
vec4 textureNoTileNeyret(sampler2D samp, vec2 uv) {
  mat2 M = inverse(mat2(1.0, 0.0, 0.5, sqrt(3.0) / 2.0));
  vec2 U = uv * hexTilingPatchScale / 8.0 * exp2(4.0 * 0.2 + 1.0);
  vec2 V = M * U;
  vec2 I = floor(V);
  vec2 Gx = dFdx(U / hexTilingPatchScale);
  vec2 Gy = dFdy(U / hexTilingPatchScale);
  vec4 meanColor = hexTilingUseContrastCorrectedBlending ? srgb2rgb(texture2D(samp, U)) : vec4(0.0);
  vec3 F = vec3(fract(V), 0.0);
  F.z = 1.0 - F.x - F.y;
  vec4 fragColor = vec4(0.0);
  vec3 W;
  if (F.z > 0.0) {
    W = vec3(F.z, F.y, F.x);
    W = pow(W, vec3(hexTilingTextureSampleCoefficientExponent));
    W /= dot(W, vec3(1.0));
    if (W.x > hexTilingLookupSkipThreshold) fragColor += hexTileSample(samp, I, U, Gx, Gy, meanColor) * W.x;
    if (W.y > hexTilingLookupSkipThreshold) fragColor += hexTileSample(samp, I + vec2(0.0, 1.0), U, Gx, Gy, meanColor) * W.y;
    if (W.z > hexTilingLookupSkipThreshold) fragColor += hexTileSample(samp, I + vec2(1.0, 0.0), U, Gx, Gy, meanColor) * W.z;
  } else {
    W = vec3(-F.z, 1.0 - F.y, 1.0 - F.x);
    W = pow(W, vec3(hexTilingTextureSampleCoefficientExponent));
    W /= dot(W, vec3(1.0));
    if (W.x > hexTilingLookupSkipThreshold) fragColor += hexTileSample(samp, I + 1.0, U, Gx, Gy, meanColor) * W.x;
    if (W.y > hexTilingLookupSkipThreshold) fragColor += hexTileSample(samp, I + vec2(1.0, 0.0), U, Gx, Gy, meanColor) * W.y;
    if (W.z > hexTilingLookupSkipThreshold) fragColor += hexTileSample(samp, I + vec2(0.0, 1.0), U, Gx, Gy, meanColor) * W.z;
  }
  fragColor = hexTilingUseContrastCorrectedBlending ? meanColor + fragColor / length(W) : fragColor;
  return clamp(rgb2srgb(fragColor), 0.0, 1.0);
}
vec4 sampleTerrainTex(sampler2D tex, vec2 worldUv) {
  return textureNoTileNeyret(tex, worldUv);
}
vec4 terrainLayerWeights(float h, vec2 mapUv) {
  float blendH = clamp(h + (terrainNoise(mapUv * 0.12) - 0.5) * 0.14, 0.0, 1.0);
  float sg = smoothstep(0.0, 0.40, blendH);
  float gs = smoothstep(0.40, 0.75, blendH);
  float sn = smoothstep(0.75, 1.0, blendH);
  float wSand = (1.0 - sg) * (1.0 - gs) * (1.0 - sn);
  float wGrass = sg * (1.0 - gs) * (1.0 - sn);
  float wStone = gs * (1.0 - sn);
  float wSnow = sn;
  return vec4(wSand, wGrass, wStone, wSnow);
}
vec4 getTerrainColor(vec2 mapUv, float h) {
  vec4 w = terrainLayerWeights(h, mapUv);
  vec4 color = vec4(0.0);
  float wSum = 0.0;
  if (w.x > terrainLayerWeightMin) { color += sampleTerrainTex(uTexSand, mapUv) * w.x; wSum += w.x; }
  if (w.y > terrainLayerWeightMin) { color += sampleTerrainTex(uTexGrass, mapUv) * w.y; wSum += w.y; }
  if (w.z > terrainLayerWeightMin) { color += sampleTerrainTex(uTexStone, mapUv) * w.z; wSum += w.z; }
  if (w.w > terrainLayerWeightMin) { color += sampleTerrainTex(uTexSnow, mapUv) * w.w; wSum += w.w; }
  return color / max(wSum, 1e-3);
}
vec3 getTerrainNormal(vec2 mapUv, float h) {
  vec4 w = terrainLayerWeights(h, mapUv);
  vec3 n = vec3(0.0);
  float wSum = 0.0;
  if (w.x > terrainLayerWeightMin) { n += texture2D(uNormSand, mapUv).xyz * w.x; wSum += w.x; }
  if (w.y > terrainLayerWeightMin) { n += texture2D(uNormGrass, mapUv).xyz * w.y; wSum += w.y; }
  if (w.z > terrainLayerWeightMin) { n += texture2D(uNormStone, mapUv).xyz * w.z; wSum += w.z; }
  if (w.w > terrainLayerWeightMin) { n += texture2D(uNormSnow, mapUv).xyz * w.w; wSum += w.w; }
  return n / max(wSum, 1e-3);
}
float getTerrainRoughness(vec2 mapUv, float h) {
  vec4 w = terrainLayerWeights(h, mapUv);
  float r = 0.0;
  float wSum = 0.0;
  if (w.x > terrainLayerWeightMin) { r += texture2D(uRoughSand, mapUv).r * w.x; wSum += w.x; }
  if (w.y > terrainLayerWeightMin) { r += texture2D(uRoughGrass, mapUv).r * w.y; wSum += w.y; }
  if (w.z > terrainLayerWeightMin) { r += texture2D(uRoughStone, mapUv).r * w.z; wSum += w.z; }
  if (w.w > terrainLayerWeightMin) { r += texture2D(uRoughSnow, mapUv).r * w.w; wSum += w.w; }
  return r / max(wSum, 1e-3);
}
float getTerrainAO(vec2 mapUv, float h) {
  vec4 w = terrainLayerWeights(h, mapUv);
  float a = 0.0;
  float wSum = 0.0;
  if (w.x > terrainLayerWeightMin) { a += texture2D(uAoSand, mapUv).r * w.x; wSum += w.x; }
  if (w.y > terrainLayerWeightMin) { a += texture2D(uAoGrass, mapUv).r * w.y; wSum += w.y; }
  if (w.z > terrainLayerWeightMin) { a += texture2D(uAoStone, mapUv).r * w.z; wSum += w.z; }
  if (w.w > terrainLayerWeightMin) { a += texture2D(uAoSnow, mapUv).r * w.w; wSum += w.w; }
  return a / max(wSum, 1e-3);
}
`;

function applyTerrainTextureBlending(material, sets) {
  material.map = sets.sand.color;
  material.normalMap = sets.sand.normal;
  material.roughnessMap = sets.sand.roughness;
  material.aoMap = sets.sand.ao;
  material.aoMapIntensity = 1.0;

  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTexSand = { value: sets.sand.color };
    shader.uniforms.uTexGrass = { value: sets.grass.color };
    shader.uniforms.uTexStone = { value: sets.stone.color };
    shader.uniforms.uTexSnow = { value: sets.snow.color };
    shader.uniforms.uNormSand = { value: sets.sand.normal };
    shader.uniforms.uNormGrass = { value: sets.grass.normal };
    shader.uniforms.uNormStone = { value: sets.stone.normal };
    shader.uniforms.uNormSnow = { value: sets.snow.normal };
    shader.uniforms.uRoughSand = { value: sets.sand.roughness };
    shader.uniforms.uRoughGrass = { value: sets.grass.roughness };
    shader.uniforms.uRoughStone = { value: sets.stone.roughness };
    shader.uniforms.uRoughSnow = { value: sets.snow.roughness };
    shader.uniforms.uAoSand = { value: sets.sand.ao };
    shader.uniforms.uAoGrass = { value: sets.grass.ao };
    shader.uniforms.uAoStone = { value: sets.stone.ao };
    shader.uniforms.uAoSnow = { value: sets.snow.ao };
    shader.uniforms.hexTilingUseContrastCorrectedBlending = { value: TERRAIN_HEX_TILING.useContrastCorrectedBlending };
    shader.uniforms.hexTilingPatchScale = { value: TERRAIN_HEX_TILING.patchScale };
    shader.uniforms.hexTilingLookupSkipThreshold = { value: TERRAIN_HEX_TILING.lookupSkipThreshold };
    shader.uniforms.hexTilingTextureSampleCoefficientExponent = { value: TERRAIN_HEX_TILING.textureSampleCoefficientExponent };
    shader.uniforms.terrainLayerWeightMin = { value: TERRAIN_HEX_TILING.layerWeightMin };

    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
attribute float heightNorm;
varying float vHeightNorm;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
vHeightNorm = heightNorm;`);

    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
uniform sampler2D uTexSand, uTexGrass, uTexStone, uTexSnow;
varying float vHeightNorm;
${TERRAIN_BLEND_GLSL}`)
      .replace('#include <map_fragment>', `#ifdef USE_MAP
diffuseColor *= getTerrainColor(vMapUv, vHeightNorm);
#endif`)
      .replace(
        'texture2D( normalMap, vNormalMapUv )',
        'vec4( getTerrainNormal( vNormalMapUv, vHeightNorm ), 1.0 )',
      )
      .replace(
        'texture2D( roughnessMap, vRoughnessMapUv )',
        'vec4( getTerrainRoughness( vMapUv, vHeightNorm ) )',
      )
      .replace(
        'texture2D( aoMap, vAoMapUv )',
        'vec4( getTerrainAO( vAoMapUv, vHeightNorm ) )',
      );
  };
  material.customProgramCacheKey = () => 'terrain-height-blend-hex-pbr-v4';
  material.needsUpdate = true;
}

// ---------- Terrain (PNG heightmap) ----------

async function loadTerrain() {
  loadingMgr.set('Heightmap', 'Loading');
  const heightPixels = await loadImagePixelData(TERRAIN_HEIGHTMAP_URL);
  loadingMgr.set('Heightmap', 'Complete');

  loadingMgr.set('Forest guide', 'Loading');
  const guidePixels = await loadImagePixelData(FOREST_SPAWN_GUIDE_URL);
  const forestGuide = buildForestSpawnGuide(guidePixels);
  loadingMgr.set('Forest guide', 'Complete');

  loadingMgr.set('Terrain', 'Loading', 'Building mesh…');
  const sampleSize = Math.min(heightPixels.width, heightPixels.height, 2048);
  const data = heightPixels.data;
  const srcW = heightPixels.width;
  const srcH = heightPixels.height;

  const segments = Math.min(sampleSize - 1, 511);
  const cols = segments + 1;
  const rows = cols;
  const geometry = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, segments, segments);
  geometry.rotateX(-Math.PI / 2);

  const uv = geometry.attributes.uv;
  geometry.setAttribute('uv2', uv);
  const pos = geometry.attributes.position;
  let minH = Infinity, maxH = -Infinity;
  const heights = new Float32Array(pos.count);
  const decodeHeight = (r, g, b) => {
    // Grayscale PNG/JPG DEM: use luma. Packed 24-bit RGB elevation: full range.
    const maxDiff = Math.max(Math.abs(r - g), Math.abs(r - b), Math.abs(g - b));
    if (maxDiff <= 2) return r / 255;
    return (r * 65536 + g * 256 + b) / 16777215;
  };
  const sampleHeightBilinear = (u, v) => {
    // u,v in 0..1 (Three UV); image row 0 is top → flip v.
    const x = THREE.MathUtils.clamp(u, 0, 1) * (srcW - 1);
    const y = THREE.MathUtils.clamp(1 - v, 0, 1) * (srcH - 1);
    const x0 = Math.floor(x);
    const y0 = Math.floor(y);
    const x1 = Math.min(x0 + 1, srcW - 1);
    const y1 = Math.min(y0 + 1, srcH - 1);
    const tx = x - x0;
    const ty = y - y0;
    const at = (ix, iy) => {
      const idx = (iy * srcW + ix) * 4;
      return decodeHeight(data[idx], data[idx + 1], data[idx + 2]);
    };
    return THREE.MathUtils.lerp(
      THREE.MathUtils.lerp(at(x0, y0), at(x1, y0), tx),
      THREE.MathUtils.lerp(at(x0, y1), at(x1, y1), tx),
      ty,
    );
  };
  for (let i = 0; i < pos.count; i++) {
    const h = sampleHeightBilinear(uv.getX(i), uv.getY(i));
    heights[i] = h;
    if (h < minH) minH = h;
    if (h > maxH) maxH = h;
  }

  // Laplacian smooth on the vertex grid to soften DEM stair-steps / noise.
  if (TERRAIN_HEIGHT_SMOOTH_PASSES > 0) {
    let cur = heights;
    let next = new Float32Array(heights.length);
    for (let pass = 0; pass < TERRAIN_HEIGHT_SMOOTH_PASSES; pass++) {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const i = r * cols + c;
          if (r === 0 || c === 0 || r === rows - 1 || c === cols - 1) {
            next[i] = cur[i];
            continue;
          }
          next[i] = (
            cur[i] * 4
            + cur[i - 1] + cur[i + 1]
            + cur[i - cols] + cur[i + cols]
          ) / 8;
        }
      }
      const swap = cur;
      cur = next;
      next = swap;
    }
    if (cur !== heights) heights.set(cur);
    minH = Infinity;
    maxH = -Infinity;
    for (let i = 0; i < heights.length; i++) {
      if (heights[i] < minH) minH = heights[i];
      if (heights[i] > maxH) maxH = heights[i];
    }
  }

  const range = maxH - minH || 1;
  const basePos = new Float32Array(pos.count * 2);
  const normalizedHeights = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) {
    basePos[i * 2] = pos.getX(i);
    basePos[i * 2 + 1] = pos.getZ(i);
    normalizedHeights[i] = (heights[i] - minH) / range;
    pos.setY(i, normalizedHeights[i] * HEIGHT_SCALE);
  }
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();
  geometry.computeBoundingSphere();

  const heightNorm = new Float32Array(pos.count);
  heightNorm.set(normalizedHeights);
  geometry.setAttribute('heightNorm', new THREE.BufferAttribute(heightNorm, 1));

  loadingMgr.set('Terrain textures', 'Loading');
  const textureSets = await loadTerrainTextureSets();
  loadingMgr.set('Terrain textures', 'Complete');

  loadingMgr.set('Terrain', 'Loading', 'Materials & collision…');
  const material = new THREE.MeshStandardMaterial({
    roughness: 0.85, metalness: 0.05, side: THREE.DoubleSide,
    polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4,
  });
  applyTerrainTextureBlending(material, textureSets);

  const mesh = new THREE.Mesh(geometry, material);
  terrainMesh = mesh;
  mesh.receiveShadow = true;
  mesh.castShadow = false;
  mesh.raycast = acceleratedRaycast;
  geometry.computeBoundsTree = computeBoundsTree;
  geometry.disposeBoundsTree = disposeBoundsTree;
  geometry.computeBoundsTree();
  const box = new THREE.Box3().setFromObject(mesh);
  const center = box.getCenter(new THREE.Vector3());
  mesh.position.x -= center.x;
  mesh.position.z -= center.z;
  mesh.position.y -= box.min.y;

  const waterMat = createOceanWaterMaterial();
  syncOceanWaterMaterial(waterMat);
  const waterMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1, WATER_SEGMENTS, WATER_SEGMENTS),
    waterMat,
  );
  waterMesh.rotation.x = -Math.PI / 2;
  waterMesh.position.y = HEIGHT_SCALE * terrainWaterHeightNorm;
  waterMesh.scale.set(TERRAIN_SIZE, TERRAIN_SIZE, 1);
  waterMesh.renderOrder = 1;
  waterMesh.frustumCulled = false;
  waterMesh.raycast = () => {};

  const group = new THREE.Group();
  group.add(mesh);
  group.add(waterMesh);
  scene.add(group);
  terrainGroup = group;

  terrainEntry = {
    group,
    mesh,
    waterMesh,
    forestGuide,
    _gridSegments: segments,
    _normalizedHeights: normalizedHeights,
    _basePositions: basePos,
  };
  loadingMgr.set('Terrain', 'Complete');
}

// ---------- Character loading ----------

async function loadCharacter() {
  loadingMgr.set('Character', 'Loading');
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const { DRACOLoader } = await import('three/addons/loaders/DRACOLoader.js');
  const draco = new DRACOLoader();
  draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/libs/draco/gltf/');
  const loader = new GLTFLoader();
  loader.setDRACOLoader(draco);

  const gltf = await new Promise((r, j) => loader.load('./cac-1783902065521.glb', r, undefined, j));
  const root = gltf.scene;
  root.traverse((child) => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });

  const group = new THREE.Group();
  group.add(root);
  const { height } = centerModel(root);
  scene.add(group);

  const clips = gltf.animations.filter((c) => c.name !== EXCLUDED_CLIP);
  const mixer = new THREE.AnimationMixer(root);
  const byName = Object.fromEntries(clips.map((c) => [c.name, c]));

  // Height-based clip config matching test-engine-index
  const CLIPS = { idle: 'InjuredIdle', walk: 'CrouchedWalking', jump: 'Jump', roll: 'SprintingForwardRoll' };
  for (const [key, name] of Object.entries(CLIPS)) {
    if (!byName[name]) {
      const available = clips.map((c) => c.name).join(', ') || '(none)';
      throw new Error(`Missing animation clip "${name}" for ${key}. Available: ${available}`);
    }
  }
  const actions = {
    idle: mixer.clipAction(byName[CLIPS.idle]),
    walk: mixer.clipAction(inPlaceClip(byName[CLIPS.walk])),
    roll: mixer.clipAction(inPlaceClip(byName[CLIPS.roll])),
    jump: mixer.clipAction(byName[CLIPS.jump]),
  };
  for (const name of ['jump', 'roll']) {
    actions[name].setLoop(THREE.LoopOnce, 1);
    actions[name].clampWhenFinished = true;
  }

  mixer.addEventListener('finished', () => {
    character.oneShot = null;
    if (!character.airborne) setGameplayState(isMoving() ? 'walk' : 'idle');
  });

  character = {
    group, mixer, actions, height, state: 'idle', oneShot: null, currentAction: null,
    rollDir: new THREE.Vector3(), vy: 0, airborne: false,
  };
  setGameplayState('idle');

  const spawn = terrainForestSystem?.spawnTree ?? findForestSpawn(terrainEntry, FOREST_SEED);
  if (spawn) {
    group.position.set(spawn.x, spawn.y + Math.max(0.05, height * 0.02), spawn.z);
  } else {
    const h = sampleTerrainHeight(group.position.x, group.position.z);
    if (h !== null) group.position.y = h + Math.max(0.05, height * 0.02);
  }
  frameCameraChar();
  loadingMgr.set('Character', 'Complete');
}

// ---------- Init ----------

async function init() {
  loadingMgr.init(LOAD_STEPS);
  try {
    await loadTerrain();
    await buildTerrainForest();
    await loadCharacter();
    loadingMgr.hide();
  } catch (err) {
    console.error(err);
    loadingMgr.fail(err);
  }
}
init();

// ---------- Render loop ----------

function loop() {
  requestAnimationFrame(loop);
  const delta = Math.min(clock.getDelta(), 0.05);
  skyAnimTime += delta * SKY_ANIM_SPEED;
  skyVisUniforms.time.value = skyAnimTime;
  syncSkyToCamera();
  if (character) {
    character.mixer.update(delta);
    if (!mapEditorOpen) {
      updateGameplay(delta);
      if (!updateVertical(delta)) snapToGround();
    }
    followCamera(delta);
    updateSunShadow();
  }
  controls.update();
  updateCameraCollision();
  updateTeleportEffects(delta);
  updateOceanWater(delta);
  renderVolumetricClouds(delta);
}
loop();
</script>
